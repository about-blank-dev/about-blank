nv-btn\">+ Nouvelle conversation<\/button>\n      <div id=\"conv-list\"><\/div>\n      <div id=\"sidebar-footer\">\n        <div id=\"footer-profile-trigger\" title=\"Modifier mon profil\">\n          <div id=\"footer-avatar\"><div id=\"footer-avatar-inner\">?<\/div><div id=\"footer-status\"><\/div><\/div>\n          <div id=\"footer-info\">\n            <div id=\"footer-name\">\u2014<\/div>\n            <div id=\"footer-email\">\u2014<\/div>\n          <\/div>\n        <\/div>\n        <button class=\"icon-btn\" id=\"logout-btn\" title=\"Se d\u00e9connecter\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16 17v-3H9v-4h7V7l5 5-5 5zM14 2a2 2 0 012 2v2h-2V4H5v16h9v-2h2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2h9z\"/><\/svg>\n        <\/button>\n      <\/div>\n    <\/aside>\n\n    <main id=\"main\">\n      <div id=\"bday-banner\">\n        <span id=\"bday-banner-text\"><\/span>\n        <button id=\"bday-banner-close\">\u2715<\/button>\n      <\/div>\n      <div id=\"chat-header\">\n        <button class=\"back-btn\" id=\"back-btn\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z\"/><\/svg>\n        <\/button>\n        <div style=\"flex:1;min-width:0;\">\n          <div id=\"chat-header-title\">Messages<\/div>\n          <div id=\"chat-header-sub\"><\/div>\n        <\/div>\n        <button class=\"icon-btn\" id=\"members-btn\" title=\"Infos\" style=\"display:none;\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z\"/><\/svg>\n        <\/button>\n      <\/div>\n\n      <div id=\"placeholder\">\n        <svg width=\"52\" height=\"52\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z\"/><\/svg>\n        <div id=\"placeholder-text\">S\u00e9lectionne une conversation, ou lance-en une nouvelle.<\/div>\n        <button class=\"primary\" id=\"placeholder-new-conv\" style=\"padding:9px 16px;\">+ Nouvelle conversation<\/button>\n      <\/div>\n\n      <div id=\"messages\"><\/div>\n      <div id=\"reply-bar\">\n        <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\" style=\"flex-shrink:0;opacity:0.6;\"><path d=\"M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z\"/><\/svg>\n        <span id=\"reply-bar-text\"><\/span>\n        <button id=\"reply-cancel\">\u2715<\/button>\n      <\/div>\n\n      <div class=\"popover\" id=\"gif-popover\">\n        <div class=\"popover-row\">\n          <input class=\"field\" id=\"gif-url-input\" type=\"text\" placeholder=\"Coller un lien GIF...\">\n          <button class=\"primary\" id=\"gif-add-btn\" style=\"padding:0 12px;\">\u2192<\/button>\n        <\/div>\n        <div id=\"gif-grid\"><\/div>\n      <\/div>\n\n      <div id=\"input-bar\">\n        <input type=\"text\" id=\"msg-text\" class=\"field\" placeholder=\"\u00c9crire un message...\" autocomplete=\"off\">\n        <button id=\"gif-btn\" title=\"Envoyer un GIF\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2a10 10 0 100 20 10 10 0 000-20zm-3.5 8a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm7 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM12 17.5c-2.33 0-4.31-1.46-5.11-3.5h10.22c-.8 2.04-2.78 3.5-5.11 3.5z\"/><\/svg>\n          <span id=\"gif-plus-badge\">+<\/span>\n        <\/button>\n        <button class=\"primary\" id=\"send-btn\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M2 21l21-9L2 3v7l15 2-15 2z\"/><\/svg>\n        <\/button>\n      <\/div>\n    <\/main>\n  <\/div>\n\n  <\!-- ============ MODALS ============ -->\n  <div class=\"modal-overlay\" id=\"modal-push\">\n    <div class=\"modal-box\">\n      <h3>Notifications<\/h3>\n      <p id=\"push-status\">\u2026<\/p>\n      <button class=\"primary\" id=\"push-device-btn\">Activer sur cet appareil<\/button>\n      <p style=\"margin-top:6px;\">Choisis ce qui te notifie (valable pour ton compte) :<\/p>\n      <label class=\"pref-row\"><input type=\"checkbox\" id=\"pref-conv\" checked><span>Messages des conversations<\/span><\/label>\n      <label class=\"pref-row\"><input type=\"checkbox\" id=\"pref-global\" checked><span>Chat global<\/span><\/label>\n      <div class=\"modal-actions\">\n        <button class=\"ghost\" id=\"push-close\">Fermer<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"modal-overlay\" id=\"modal-new-conv\">\n    <div class=\"modal-box\">\n      <h3>Nouvelle conversation<\/h3>\n      <p>Entre un ou plusieurs emails (Entr\u00e9e pour en ajouter plusieurs).<\/p>\n      <div style=\"display:flex;gap:8px;\">\n        <input class=\"field\" id=\"new-conv-email\" type=\"email\" placeholder=\"email@exemple.com\" style=\"flex:1;\">\n        <button class=\"ghost\" id=\"add-email-chip\" style=\"padding:0 14px;flex-shrink:0;\">+<\/button>\n      <\/div>\n      <div class=\"chips-wrap\" id=\"email-chips\"><\/div>\n      <div class=\"modal-error\" id=\"new-conv-error\"><\/div>\n      <div class=\"modal-actions\">\n        <button class=\"ghost\" id=\"new-conv-cancel\">Annuler<\/button>\n        <button class=\"primary\" id=\"new-conv-create\">Cr\u00e9er<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"modal-overlay\" id=\"modal-rename-conv\">\n    <div class=\"modal-box\">\n      <h3>Renommer la conversation<\/h3>\n      <input class=\"field\" id=\"rename-conv-input\" type=\"text\" placeholder=\"Nouveau nom...\">\n      <div class=\"modal-actions\">\n        <button class=\"ghost\" id=\"rename-cancel\">Annuler<\/button>\n        <button class=\"primary\" id=\"rename-confirm\">Renommer<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"modal-overlay\" id=\"modal-members\">\n    <div class=\"modal-box\">\n      <h3 id=\"members-title\">Membres<\/h3>\n      <div id=\"members-extra\"><\/div>\n      <div id=\"members-list\" style=\"display:flex;flex-direction:column;gap:2px;max-height:280px;overflow-y:auto;\"><\/div>\n      <div class=\"modal-actions\">\n        <button class=\"ghost\" id=\"members-close\">Fermer<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"modal-overlay\" id=\"modal-profile\">\n    <div class=\"modal-box\">\n      <h3>Mon profil<\/h3>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <div class=\"avatar-lg\" id=\"profile-avatar-preview\">?<\/div>\n        <div style=\"flex:1;\">\n          <label class=\"field-label\">Lien de la photo de profil<\/label>\n          <input class=\"field\" id=\"profile-avatar-url\" type=\"url\" placeholder=\"https://...\">\n        <\/div>\n      <\/div>\n      <div>\n        <label class=\"field-label\">Nom d'utilisateur<\/label>\n        <input class=\"field\" id=\"profile-username\" type=\"text\" placeholder=\"Nom d'utilisateur\">\n      <\/div>\n      <div>\n        <label class=\"field-label\">Description<\/label>\n        <textarea class=\"field\" id=\"profile-bio\" rows=\"3\" placeholder=\"Une petite description...\"><\/textarea>\n      <\/div>\n      <div>\n        <label class=\"field-label\">Date de f\u00eate<\/label>\n        <input class=\"field\" id=\"profile-birthday\" type=\"date\">\n        <span style=\"font-size:11px;color:var(--muted);\">Seuls le jour et le mois sont utilis\u00e9s \u2014 pour un rappel le jour m\u00eame.<\/span>\n      <\/div>\n      <div class=\"modal-error\" id=\"profile-error\"><\/div>\n      <div class=\"modal-actions\">\n        <button class=\"ghost\" id=\"profile-cancel\">Annuler<\/button>\n        <button class=\"primary\" id=\"profile-save\">Enregistrer<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n\n<script>\n(function(){\n\n  // ==================== CONFIG ====================\n  const WORKER_URL = 'https://about-blank-chat.elix-hardy9.workers.dev';\n  const GLOBAL_ID = '__global__';\n  const VAPID_PUBLIC_KEY = 'BNbPMoCwKI6JpXHCYov4BzrVM04sXPP82WHtd6sofV5JDnjrr9_T9OI7DFUVZYo1Kx9tLwkUtvOtS_mfeiZ6hCU';\n\n  // ==================== HELPERS ====================\n  const $ = id => document.getElementById(id);\n  const getStore = (key, def) => { try { return JSON.parse(localStorage.getItem(key) ?? JSON.stringify(def)); } catch(e) { return def; } };\n  const setStore = (key, val) => localStorage.setItem(key, JSON.stringify(val));\n  function escapeHtml(str) {\n    return String(str ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n  }\n  function timeStr(iso) { return new Date(iso).toLocaleTimeString('fr-CA', { hour: '2-digit', minute: '2-digit' }); }\n  function avatarHtml(user, initial) {\n    if (user && user.avatar_url) return `<img class=\"avatar-img\" src=\"${escapeHtml(user.avatar_url)}\" alt=\"\">`;\n    return escapeHtml(initial || '?');\n  }\n  function todayMMDD() {\n    const d = new Date();\n    return String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n  }\n  function isBirthdayToday(bday) { return !!bday && bday.length === 5 && bday === todayMMDD(); }\n  function formatBirthday(bday) {\n    if (!bday || bday.length !== 5) return '';\n    const months = ['janvier','f\u00e9vrier','mars','avril','mai','juin','juillet','ao\u00fbt','septembre','octobre','novembre','d\u00e9cembre'];\n    const [mm, dd] = bday.split('-').map(Number);\n    if (!mm || !dd) return '';\n    return `${dd} ${months[mm - 1]}`;\n  }\n  function isGifMarker(text) { return typeof text === 'string' && text.startsWith('%%GIF%%'); }\n  function gifUrlFrom(text) { return text.slice(7); }\n\n  // ==================== THEME (suit le th\u00e8me de l'app) ====================\n  function applyTheme(theme) {\n    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');\n    else document.documentElement.removeAttribute('data-theme');\n  }\n  window.addEventListener('message', e => {\n    if (e.source === parent && e.data && e.data.type === 'msg-theme') applyTheme(e.data.theme);\n  });\n  try { parent.postMessage({ type: 'msg-ready' }, '*'); } catch (e) {}\n\n  // ==================== AUTH ====================\n  function getAuthToken() { return localStorage.getItem('cf_jwt') || null; }\n  function setAuthToken(t) { t ? localStorage.setItem('cf_jwt', t) : localStorage.removeItem('cf_jwt'); }\n\n  async function apiFetch(path, options = {}) {\n    const token = getAuthToken();\n    const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };\n    if (token) headers['Authorization'] = 'Bearer ' + token;\n    const res = await fetch(WORKER_URL + path, { ...options, headers });\n    if (res.status === 204) return {};\n    const data = await res.json().catch(() => ({}));\n    if (!res.ok) throw Object.assign(new Error(data.error || 'Erreur r\u00e9seau'), { code: data.code || '', email: data.email || '' });\n    return data;\n  }\n\n  let currentUser = null;\n  let registerMode = false;\n\n  function toggleAuthMode() {\n    registerMode = !registerMode;\n    $('auth-username').style.display = registerMode ? 'block' : 'none';\n    $('auth-submit').textContent = registerMode ? \"S'inscrire\" : 'Se connecter';\n    $('auth-sub-text').textContent = registerMode ? 'Cr\u00e9e ton compte pour continuer' : 'Connecte-toi pour continuer';\n    $('auth-switch').innerHTML = registerMode\n      ? 'D\u00e9j\u00e0 un compte ? <button id=\"auth-toggle\">Se connecter<\/button>'\n      : 'Pas encore de compte ? <button id=\"auth-toggle\">Cr\u00e9er un compte<\/button>';\n    $('auth-error').classList.remove('show');\n  }\n  // Le conteneur ne change jamais : on \u00e9coute les clics ici (le bouton, lui, est remplac\u00e9 \u00e0 chaque bascule)\n  $('auth-switch').addEventListener('click', e => { if (e.target.closest('#auth-toggle')) toggleAuthMode(); });\n\n  async function doAuth() {\n    const email = $('auth-email').value.trim().toLowerCase();\n    const pw = $('auth-pw').value.trim();\n    const username = $('auth-username').value.trim() || email.split('@')[0];\n    const errEl = $('auth-error');\n    if (!email || !pw) return;\n    errEl.classList.remove('show');\n    try {\n      const data = registerMode\n        ? await apiFetch('/api/register', { method: 'POST', body: JSON.stringify({ email, password: pw, username }) })\n        : await apiFetch('/api/login', { method: 'POST', body: JSON.stringify({ email, password: pw }) });\n      setAuthToken(data.token);\n      currentUser = data.user;\n      setStore('msg_current_user', currentUser);\n      onLoggedIn();\n    } catch (err) {\n      const msgs = {\n        EMAIL_EXISTS: 'Email d\u00e9j\u00e0 utilis\u00e9.',\n        WEAK_PASSWORD: 'Mot de passe trop court (6 caract\u00e8res min).',\n        INVALID_EMAIL: 'Email invalide.',\n        INVALID_CREDENTIALS: 'Email ou mot de passe incorrect.',\n      };\n      errEl.textContent = msgs[err.code] || err.message;\n      errEl.classList.add('show');\n    }\n  }\n  $('auth-submit').onclick = doAuth;\n  $('auth-open-settings').onclick = () => { try { parent.postMessage({ type: 'msg-open-settings' }, '*'); } catch (e) {} };\n  [$('auth-email'), $('auth-pw'), $('auth-username')].forEach(el => {\n    el.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });\n  });\n\n  function logout() {\n    try { parent.postMessage({ type: 'msg-auth', loggedIn: false }, '*'); parent.postMessage({ type: 'msg-unread', total: 0 }, '*'); } catch (e) {}\n    setAuthToken(null);\n    currentUser = null;\n    setStore('msg_current_user', null);\n    stopAllPolling();\n    $('auth-email').value = ''; $('auth-pw').value = ''; $('auth-username').value = '';\n    $('app').style.display = 'none';\n    $('auth-screen').style.display = 'flex';\n  }\n  $('logout-btn').onclick = logout;\n\n  function updateFooterAvatar() {\n    $('footer-avatar-inner').innerHTML = avatarHtml(currentUser, (currentUser.username || '?')[0].toUpperCase());\n  }\n\n  function onLoggedIn() {\n    try { parent.postMessage({ type: 'msg-auth', loggedIn: true }, '*'); } catch (e) {}\n    $('auth-screen').style.display = 'none';\n    $('app').style.display = 'flex';\n    updateFooterAvatar();\n    $('footer-name').textContent = currentUser.username;\n    $('footer-email').textContent = currentUser.email;\n    activeId = null; activeKind = 'conv';\n    renderShell();\n    startAdaptivePolling();\n    pingPresence();\n    initPush();\n  }\n\n  // ==================== STATE ====================\n  let activeId = null;\n  let activeKind = 'conv';\n  let convsCache = [];\n  let unreadByConv = {};\n  let lastSeenMsgId = getStore('lastSeenMsgId', {});\n  let pendingEmailChips = [];\n  let replyingToId = null;\n  let replyingToGlobalId = null;\n\n  function saveLastSeen() { setStore('lastSeenMsgId', lastSeenMsgId); }\n\n  // ==================== CONVERSATIONS ====================\n  async function getUserConversations() {\n    if (!currentUser) return [];\n    try {\n      const data = await apiFetch('/api/conversations');\n      const blacklist = getStore('msg_deleted_convs', []);\n      const seenIds = new Set(), seenMembers = new Set();\n      return (data.conversations || []).filter(c => {\n        if (blacklist.includes(c.id) || seenIds.has(c.id)) return false;\n        const ids = (c.members || []).map(m => m.id);\n        if (ids.length && !ids.includes(currentUser.id)) return false;\n        const key = ids.slice().sort().join('|');\n        if (key && seenMembers.has(key)) return false;\n        seenIds.add(c.id);\n        if (key) seenMembers.add(key);\n        return true;\n      });\n    } catch (e) { console.error(e); return []; }\n  }\n\n  async function getConvMessages(convId) {\n    try { const data = await apiFetch('/api/conversations/' + convId + '/messages'); return data.messages || []; }\n    catch (e) { console.error(e); return []; }\n  }\n\n  function getConvDisplayName(conv) {\n    if (!currentUser) return conv.name || 'Conversation';\n    const customNames = getStore('msg_custom_names', {});\n    const key = currentUser.id + '_' + conv.id;\n    if (customNames[key]) return customNames[key];\n    if (conv.members && conv.members.length > 0) {\n      const others = conv.members.filter(m => m.id !== currentUser.id);\n      if (others.length > 0) return others.map(m => m.username || m.email).join(', ');\n    }\n    return conv.name || 'Conversation';\n  }\n\n  function setConvCustomName(convId, name) {\n    const customNames = getStore('msg_custom_names', {});\n    customNames[currentUser.id + '_' + convId] = name;\n    setStore('msg_custom_names', customNames);\n  }\n\n  function getPinnedConv() { return currentUser ? (getStore('msg_pinned_convs', {})[currentUser.id] || null) : null; }\n  function setPinnedConv(convId) {\n    if (!currentUser) return;\n    const pins = getStore('msg_pinned_convs', {});\n    pins[currentUser.id] = convId;\n    setStore('msg_pinned_convs', pins);\n  }\n\n  async function createConvFromEmails(emails) {\n    try { const data = await apiFetch('/api/conversations', { method: 'POST', body: JSON.stringify({ emails }) }); return { conv: data.conversation }; }\n    catch (e) { return { error: e.message, email: e.email || '' }; }\n  }\n\n  async function deleteConv(convId) {\n    if (!confirm('Supprimer cette conversation ?')) return;\n    const blacklist = getStore('msg_deleted_convs', []);\n    if (!blacklist.includes(convId)) blacklist.push(convId);\n    setStore('msg_deleted_convs', blacklist);\n    if (getPinnedConv() === convId) setPinnedConv(null);\n    if (activeId === convId) activeId = null;\n    await renderShell();\n  }\n\n  function togglePinConv(convId) { setPinnedConv(getPinnedConv() === convId ? null : convId); renderSidebar(); }\n\n  // ==================== SEND / LOAD MESSAGES ====================\n  async function sendMessage(convId, text) {\n    if (!text.trim() || !currentUser) return;\n    try {\n      await apiFetch('/api/conversations/' + convId + '/messages', {\n        method: 'POST', body: JSON.stringify({ text: text.trim(), reply_to: replyingToId || undefined })\n      });\n      cancelReply();\n      resetConvActivity();\n      await loadConvMessages(convId, true);\n    } catch (e) { alert('Erreur envoi : ' + e.message); }\n  }\n\n  let _msgSig = null;\n  async function loadConvMessages(convId, force) {\n    const container = $('messages');\n    const raw = await getConvMessages(convId);\n    if (activeId !== convId || activeKind !== 'conv') return;\n    const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;\n    const sig = raw.map(m => m.id + (m.readBy?.length || 0)).join(',');\n    if (!force && sig === _msgSig) return;\n\n    if (sig !== _msgSig && raw.length > 0) {\n      const newestAt = new Date(raw[raw.length - 1].sent_at).getTime();\n      if (!lastConvMessageAt || newestAt > lastConvMessageAt) lastConvMessageAt = newestAt;\n    }\n    _msgSig = sig;\n\n    container.innerHTML = '';\n    container.classList.remove('empty');\n    if (raw.length === 0) {\n      container.classList.add('empty');\n      container.innerHTML = '<div class=\"empty-msg\">Aucun message. Dis bonjour !<\/div>';\n    } else {\n      const conv = convsCache.find(c => c.id === convId);\n      const isGroup = conv?.isGroup || conv?.is_group;\n      raw.forEach(msg => {\n        const isMe = (msg.senderId || msg.sender_id) === currentUser.id;\n        container.appendChild(buildBubble(msg, isMe, isGroup));\n      });\n      if (wasAtBottom) requestAnimationFrame(() => container.scrollTop = container.scrollHeight);\n    }\n    markConvAsRead(convId, raw);\n  }\n\n  function bubbleBodyHtml(text) {\n    if (isGifMarker(text)) return `<img class=\"bubble-gif-img\" src=\"${escapeHtml(gifUrlFrom(text))}\" alt=\"GIF\">`;\n    return `<div class=\"bubble-text\">${escapeHtml(text)}<\/div>`;\n  }\n\n  function buildBubble(msg, isMe, isGroup) {\n    const wrap = document.createElement('div');\n    wrap.className = 'bubble-wrap ' + (isMe ? 'me' : 'them');\n\n    const bubble = document.createElement('div');\n    const gif = isGifMarker(msg.text);\n    bubble.className = 'bubble ' + (isMe ? 'me' : 'them') + (gif ? ' gif' : '');\n    const time = timeStr(msg.sent_at);\n    const senderLabel = isMe ? 'Moi' : (msg.sender_name || '?');\n\n    let readStr = '';\n    if (isMe && msg.readBy && msg.readBy.length > 0) {\n      const names = msg.readBy.filter(r => r.user_id !== currentUser.id).map(r => r.username);\n      if (names.length > 0) readStr = '\u2713 Vu par ' + names.map(escapeHtml).join(', ');\n      else if (msg.memberCount <= 2) readStr = '\u2713 Envoy\u00e9';\n    }\n\n    bubble.innerHTML = `${(!isMe && isGroup) ? `<div class=\"bubble-sender\">${escapeHtml(msg.sender_name || '?')}<\/div>` : ''}${msg.replyText ? `<div class=\"bubble-reply\"><div class=\"rs\">${escapeHtml(msg.replySender || '?')}<\/div><div class=\"rt\">${isGifMarker(msg.replyText) ? 'GIF' : escapeHtml(msg.replyText)}<\/div><\/div>` : ''}${bubbleBodyHtml(msg.text)}<div class=\"bubble-time\">${time}<\/div>${readStr ? `<div class=\"bubble-reads\">${readStr}<\/div>` : ''}`;\n\n    const replyBtn = document.createElement('button');\n    replyBtn.className = 'reply-trigger';\n    replyBtn.textContent = 'R\u00e9pondre';\n    replyBtn.onclick = () => setReply(msg.id, senderLabel, gif ? 'GIF' : msg.text);\n\n    wrap.appendChild(bubble);\n    wrap.appendChild(replyBtn);\n    return wrap;\n  }\n\n  function setReply(msgId, senderName, text) {\n    replyingToId = msgId;\n    $('reply-bar-text').textContent = `${senderName} : ${text.slice(0, 60)}${text.length > 60 ? '\u2026' : ''}`;\n    $('reply-bar').classList.add('show');\n  }\n  function cancelReply() { replyingToId = null; $('reply-bar').classList.remove('show'); }\n  $('reply-cancel').onclick = cancelReply;\n\n  // ==================== GLOBAL CHAT ====================\n  let _globalSig = null;\n  async function loadGlobalMessages() {\n    const container = $('messages');\n    if (!currentUser) return;\n    try {\n      const data = await apiFetch('/api/global-messages');\n      if (activeId !== GLOBAL_ID) return;\n      const msgs = data.messages || [];\n      const sig = msgs.map(m => m.id).join(',');\n      if (sig === _globalSig) return;\n      _globalSig = sig;\n\n      if (msgs.length > 0) {\n        const newestAt = new Date(msgs[msgs.length - 1].sent_at).getTime();\n        if (!lastGlobalMessageAt || newestAt > lastGlobalMessageAt) lastGlobalMessageAt = newestAt;\n      }\n\n      const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;\n      container.innerHTML = '';\n      container.classList.remove('empty');\n      if (msgs.length === 0) {\n        container.classList.add('empty');\n        container.innerHTML = '<div class=\"empty-msg\">Aucun message. Sois le premier !<\/div>';\n      } else {\n        msgs.forEach(msg => {\n          const isMe = msg.sender_id === currentUser?.id;\n          const gif = isGifMarker(msg.text);\n          const wrap = document.createElement('div');\n          wrap.className = 'bubble-wrap ' + (isMe ? 'me' : 'them');\n          const bubble = document.createElement('div');\n          bubble.className = 'bubble ' + (isMe ? 'me' : 'them') + (gif ? ' gif' : '');\n          const time = timeStr(msg.sent_at);\n          bubble.innerHTML = `${!isMe ? `<div class=\"bubble-sender\">${escapeHtml(msg.sender_name || '?')}<\/div>` : ''}${msg.replyText ? `<div class=\"bubble-reply\"><div class=\"rs\">${escapeHtml(msg.replySender || '?')}<\/div><div class=\"rt\">${isGifMarker(msg.replyText) ? 'GIF' : escapeHtml(msg.replyText)}<\/div><\/div>` : ''}${bubbleBodyHtml(msg.text)}<div class=\"bubble-time\">${time}<\/div>`;\n          const replyBtn = document.createElement('button');\n          replyBtn.className = 'reply-trigger';\n          replyBtn.textContent = 'R\u00e9pondre';\n          replyBtn.onclick = () => setGlobalReply(msg.id, msg.sender_name || '?', gif ? 'GIF' : msg.text);\n          wrap.appendChild(bubble);\n          wrap.appendChild(replyBtn);\n          container.appendChild(wrap);\n        });\n        if (wasAtBottom) container.scrollTop = container.scrollHeight;\n      }\n    } catch (e) {\n      container.innerHTML = `<div class=\"empty-msg\" style=\"color:var(--danger);\">Erreur : ${escapeHtml(e.message)}<\/div>`;\n    }\n  }\n\n  async function sendGlobalMessage(text) {\n    if (!text.trim() || !currentUser) return;\n    try {\n      await apiFetch('/api/global-messages', {\n        method: 'POST', body: JSON.stringify({ text: text.trim(), reply_to: replyingToGlobalId || undefined })\n      });\n      cancelGlobalReply();\n      resetGlobalActivity();\n      _globalSig = null;\n      await loadGlobalMessages();\n    } catch (e) { console.error(e); }\n  }\n\n  function setGlobalReply(msgId, senderName, text) {\n    replyingToGlobalId = msgId;\n    $('reply-bar-text').textContent = `${senderName} : ${text.slice(0, 60)}${text.length > 60 ? '\u2026' : ''}`;\n    $('reply-bar').classList.add('show');\n  }\n  function cancelGlobalReply() { replyingToGlobalId = null; $('reply-bar').classList.remove('show'); }\n\n  // ==================== GIFS ====================\n  function loadGifs() { return getStore('msg_recent_gifs', []); }\n  function saveGifUse(url) {\n    let list = loadGifs().filter(u => u !== url);\n    list.unshift(url);\n    if (list.length > 30) list = list.slice(0, 30);\n    setStore('msg_recent_gifs', list);\n  }\n  function renderGifGrid() {\n    const grid = $('gif-grid');\n    const list = loadGifs();\n    grid.innerHTML = '';\n    if (list.length === 0) { grid.innerHTML = '<div id=\"gif-empty\">Aucun GIF utilis\u00e9 pour l\\'instant.<\/div>'; return; }\n    list.forEach(url => {\n      const img = document.createElement('img');\n      img.src = url; img.loading = 'lazy'; img.alt = 'GIF';\n      img.onclick = () => sendGif(url);\n      grid.appendChild(img);\n    });\n  }\n  function sendGif(url) {\n    if (!url || !/^https?:\\/\\//i.test(url)) { alert('Lien invalide.'); return; }\n    saveGifUse(url);\n    renderGifGrid();\n    const marker = '%%GIF%%' + url;\n    if (activeKind === 'global') sendGlobalMessage(marker);\n    else if (activeId) sendMessage(activeId, marker);\n    $('gif-popover').classList.remove('open');\n    $('gif-url-input').value = '';\n  }\n  $('gif-btn').onclick = () => {\n    const pop = $('gif-popover');\n    pop.classList.toggle('open');\n    if (pop.classList.contains('open')) { renderGifGrid(); setTimeout(() => $('gif-url-input').focus(), 50); }\n  };\n  $('gif-add-btn').onclick = () => { const v = $('gif-url-input').value.trim(); if (v) sendGif(v); };\n  $('gif-url-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('gif-add-btn').click(); } });\n  document.addEventListener('click', e => {\n    const pop = $('gif-popover');\n    if (pop.classList.contains('open') && !pop.contains(e.target) && e.target !== $('gif-btn') && !$('gif-btn').contains(e.target)) {\n      pop.classList.remove('open');\n    }\n  });\n\n  // ==================== PUSH NOTIFICATIONS ====================\n  function urlBase64ToUint8Array(base64String) {\n    const padding = '='.repeat((4 - base64String.length % 4) % 4);\n    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');\n    const rawData = atob(base64);\n    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));\n  }\n  // La messagerie est dans un iframe : on enregistre le service worker depuis la page principale (m\u00eame origine)\n  function getHost() {\n    try { if (window.parent && window.parent !== window) { void window.parent.document; return window.parent; } } catch (e) {}\n    return window;\n  }\n  const HOST = getHost();\n  const SW_URL = new URL('sw.js', HOST.location.href).href;\n\n  function pushSupported() {\n    return ('serviceWorker' in HOST.navigator) && ('PushManager' in HOST) && ('Notification' in HOST);\n  }\n\n  // Enregistre sw.js et attend qu'il soit actif (10 s max, avec une vraie erreur au lieu d'un blocage silencieux)\n  async function getReadyRegistration() {\n    const reg = await HOST.navigator.serviceWorker.register(SW_URL);\n    if (reg.active) return reg;\n    const sw = reg.installing || reg.waiting;\n    if (!sw || sw.state === 'activated') return reg;\n    await new Promise((resolve, reject) => {\n      const t = setTimeout(() => reject(new Error('le service worker met trop de temps \u00e0 d\u00e9marrer')), 10000);\n      sw.addEventListener('statechange', () => {\n        if (sw.state === 'activated') { clearTimeout(t); resolve(); }\n        else if (sw.state === 'redundant') { clearTimeout(t); reject(new Error('le service worker a \u00e9t\u00e9 rejet\u00e9')); }\n      });\n    });\n    return reg;\n  }\n\n  function sameVapidKey(sub) {\n    try {\n      const k = sub.options && sub.options.applicationServerKey;\n      if (!k) return true;\n      const x = new Uint8Array(k), y = urlBase64ToUint8Array(VAPID_PUBLIC_KEY);\n      return x.length === y.length && x.every((v, idx) => v === y[idx]);\n    } catch (e) { return true; }\n  }\n\n  async function sendSubscriptionToServer(sub) {\n    const raw = sub.toJSON();\n    await apiFetch('/api/push/subscribe', { method: 'POST', body: JSON.stringify({ endpoint: raw.endpoint, keys: raw.keys }) });\n  }\n\n  async function subscribePush(reg) {\n    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });\n    try { await sendSubscriptionToServer(sub); }\n    catch (e) { await sub.unsubscribe().catch(() => {}); throw e; }\n    return sub;\n  }\n\n  function updatePushIcon(active) {\n    $('push-toggle').style.color = active ? 'var(--success)' : '';\n    $('push-toggle').title = active ? 'Notifications activ\u00e9es (r\u00e9glages)' : 'Notifications (r\u00e9glages)';\n  }\n\n  // Appel\u00e9 \u00e0 chaque connexion : renvoie l'abonnement au serveur pour le lier au compte connect\u00e9\n  async function initPush() {\n    if (!pushSupported()) { $('push-toggle').style.display = 'none'; return; }\n    try {\n      const reg = await getReadyRegistration();\n      let sub = await reg.pushManager.getSubscription();\n      if (sub && !sameVapidKey(sub)) {\n        // Abonnement cr\u00e9\u00e9 avec une ancienne cl\u00e9 VAPID : il ne recevrait jamais rien\n        await sub.unsubscribe().catch(() => {});\n        sub = null;\n        if (HOST.Notification.permission === 'granted') sub = await subscribePush(reg).catch(() => null);\n      } else if (sub && HOST.Notification.permission === 'granted') {\n        await sendSubscriptionToServer(sub).catch(() => {});\n      }\n      updatePushIcon(!!sub);\n    } catch (e) { console.warn('Service worker non enregistr\u00e9 :', e); updatePushIcon(false); }\n  }\n\n  let pushBusy = false;\n\n  // Active / d\u00e9sactive les notifications sur CET appareil. Renvoie un message \u00e0 afficher.\n  async function togglePushDevice() {\n    if (!pushSupported()) return 'Les notifications ne sont pas support\u00e9es sur ce navigateur.';\n    if (HOST.Notification.permission === 'denied') {\n      return \"Les notifications sont bloqu\u00e9es pour ce site. Clique sur l'ic\u00f4ne \u00e0 gauche de l'adresse > Param\u00e8tres du site > Notifications > Autoriser, puis r\u00e9essaie.\";\n    }\n    if (HOST.Notification.permission === 'default') {\n      const perm = await HOST.Notification.requestPermission();\n      if (perm !== 'granted') return 'Notifications refus\u00e9es.';\n    }\n    let reg;\n    try { reg = await getReadyRegistration(); }\n    catch (e) { return 'Service worker non enregistr\u00e9 : ' + e.message + ' (fichier attendu : ' + SW_URL + ')'; }\n    try {\n      const existing = await reg.pushManager.getSubscription();\n      if (existing && sameVapidKey(existing)) {\n        try { await apiFetch('/api/push/unsubscribe', { method: 'POST', body: JSON.stringify({ endpoint: existing.endpoint }) }); } catch (e) {}\n        await existing.unsubscribe();\n        updatePushIcon(false);\n        return 'Notifications d\u00e9sactiv\u00e9es sur cet appareil.';\n      }\n      if (existing) await existing.unsubscribe().catch(() => {});\n      await subscribePush(reg);\n      updatePushIcon(true);\n      return 'Notifications activ\u00e9es sur cet appareil.';\n    } catch (e) { return 'Erreur activation notifications : ' + e.message; }\n  }\n\n  // Abonnement push actuel de cet appareil (ou null)\n  async function getPushSubscription() {\n    if (!pushSupported()) return null;\n    try { const reg = await getReadyRegistration(); return await reg.pushManager.getSubscription(); }\n    catch (e) { return null; }\n  }\n\n  async function refreshPushModal() {\n    let active = false;\n    try {\n      if (pushSupported()) { const sub = await getPushSubscription(); active = !!sub && sameVapidKey(sub); }\n      $('push-status').textContent = pushSupported()\n        ? (active ? 'Notifications activ\u00e9es sur cet appareil.' : 'Notifications d\u00e9sactiv\u00e9es sur cet appareil.')\n        : 'Les notifications ne sont pas support\u00e9es sur ce navigateur.';\n    } catch (e) { $('push-status').textContent = 'Impossible de lire l\\'\u00e9tat des notifications : ' + e.message; }\n    $('push-device-btn').textContent = active ? 'D\u00e9sactiver sur cet appareil' : 'Activer sur cet appareil';\n    updatePushIcon(active);\n  }\n  async function loadPushPrefs() {\n    try {\n      const p = await apiFetch('/api/push/prefs');\n      $('pref-conv').checked = !!p.conv;\n      $('pref-global').checked = !!p.global;\n    } catch (e) {}\n  }\n  async function savePushPref(key, input) {\n    const value = input.checked;\n    try { await apiFetch('/api/push/prefs', { method: 'PATCH', body: JSON.stringify({ [key]: value ? 1 : 0 }) }); }\n    catch (e) {\n      input.checked = !value;\n      alert(/Route non trouv\u00e9e/.test(e.message)\n        ? \"Le serveur n'est pas \u00e0 jour : d\u00e9ploie la derni\u00e8re version du worker sur Cloudflare.\"\n        : 'Impossible de sauvegarder : ' + e.message);\n    }\n  }\n\n  $('push-toggle').onclick = () => {\n    $('modal-push').classList.add('open');\n    refreshPushModal();\n    loadPushPrefs();\n  };\n  $('push-device-btn').onclick = async () => {\n    if (pushBusy) return;\n    pushBusy = true; $('push-device-btn').disabled = true;\n    try { const msg = await togglePushDevice(); await refreshPushModal(); $('push-status').textContent = msg; }\n    finally { pushBusy = false; $('push-device-btn').disabled = false; }\n  };\n  $('pref-conv').onchange = e => savePushPref('conv', e.target);\n  $('pref-global').onchange = e => savePushPref('global', e.target);\n  $('push-close').onclick = () => $('modal-push').classList.remove('open');\n\n  // ==================== PRESENCE ====================\n  async function pingPresence() { if (currentUser) { try { await apiFetch('/api/presence', { method: 'POST' }); } catch (e) {} } }\n  async function getOnlineUsers() {\n    if (!currentUser) return [];\n    try { const data = await apiFetch('/api/presence', { method: 'POST' }); return data.online || []; } catch (e) { return []; }\n  }\n\n  async function showOnlineMembers() {\n    $('members-extra').innerHTML = '';\n    const users = await getOnlineUsers();\n    const list = $('members-list');\n    list.innerHTML = '';\n    const now = Date.now();\n    const ONLINE_MS = 2 * 60 * 1000;\n    if (users.length === 0) {\n      list.innerHTML = '<div class=\"empty-msg\">Aucun utilisateur.<\/div>';\n    } else {\n      users.forEach(u => {\n        const isMe = u.user_id === currentUser?.id;\n        const lastSeen = u.last_seen ? new Date(u.last_seen).getTime() : 0;\n        const isOnline = (now - lastSeen) < ONLINE_MS;\n        const row = document.createElement('div');\n        row.className = 'member-row' + (isMe ? '' : ' clickable');\n        row.innerHTML = `\n          <div class=\"presence-dot ${isOnline ? 'on' : 'off'}\"><\/div>\n          <div style=\"flex:1;\"><div class=\"member-name\">${escapeHtml(u.username || u.user_id)}${isMe ? ' <span style=\"color:var(--muted);font-weight:400;\">(toi)<\/span>' : ''}<\/div><\/div>\n        `;\n        if (!isMe) {\n          row.onclick = async () => {\n            closeModal('modal-members');\n            try {\n              const convs = await getUserConversations();\n              const existing = convs.find(c => !c.is_group && c.members && c.members.length === 2 && c.members.some(m => m.id === u.user_id));\n              if (existing) { activeId = existing.id; activeKind = 'conv'; }\n              else {\n                const data = await apiFetch('/api/users/' + u.user_id);\n                const email = data.user?.email;\n                if (!email) return;\n                const result = await createConvFromEmails([email]);\n                if (!result.conv) { alert(result.error || 'Erreur'); return; }\n                activeId = result.conv.id; activeKind = 'conv';\n              }\n              await renderShell();\n              openChatMobile();\n            } catch (e) { alert('Erreur : ' + e.message); }\n          };\n        }\n        list.appendChild(row);\n      });\n    }\n    $('members-title').textContent = 'Utilisateurs en ligne';\n    openModal('modal-members');\n  }\n\n  async function showConvMembers() {\n    const conv = convsCache.find(c => c.id === activeId);\n    if (!conv) return;\n    const members = conv.members || [];\n    const others = members.filter(m => m.id !== currentUser.id);\n    const isGroup = (conv.isGroup || conv.is_group) || others.length > 1;\n    $('members-title').textContent = isGroup ? 'Infos du groupe' : 'Profil';\n\n    const extra = $('members-extra');\n    if (isGroup) {\n      extra.innerHTML = `\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:4px;\">\n          <label class=\"field-label\">Description du groupe<\/label>\n          <textarea class=\"field\" id=\"conv-desc-input\" rows=\"2\" placeholder=\"Aucune description\">${escapeHtml(conv.description || '')}<\/textarea>\n          <button class=\"ghost\" id=\"conv-desc-save\" style=\"align-self:flex-end;padding:6px 12px;font-size:12px;\">Enregistrer<\/button>\n        <\/div>\n        <div style=\"height:1px;background:var(--card-border);margin:2px 0 8px;\"><\/div>\n      `;\n      $('conv-desc-save').onclick = async () => {\n        const description = $('conv-desc-input').value.trim();\n        try {\n          const data = await apiFetch('/api/conversations/' + conv.id, { method: 'PATCH', body: JSON.stringify({ description }) });\n          const newDesc = data.conversation?.description ?? description;\n          conv.description = newDesc;\n          const idx = convsCache.findIndex(c => c.id === conv.id);\n          if (idx >= 0) convsCache[idx].description = newDesc;\n        } catch (e) { alert('Erreur : ' + e.message); }\n      };\n    } else if (others[0]) {\n      const other = others[0];\n      extra.innerHTML = `\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:8px;\">\n          <div class=\"avatar-lg\">${avatarHtml(other, (other.username || '?')[0].toUpperCase())}<\/div>\n          <div>\n            <div style=\"font-weight:700;font-size:15px;\">${escapeHtml(other.username || '?')}${isBirthdayToday(other.birthday) ? ' \ud83c\udf82' : ''}<\/div>\n            <div style=\"font-size:12px;color:var(--muted);\">${escapeHtml(other.email)}<\/div>\n          <\/div>\n        <\/div>\n        ${other.bio ? `<div style=\"font-size:13px;line-height:1.5;margin-bottom:6px;\">${escapeHtml(other.bio)}<\/div>` : ''}\n        ${other.birthday ? `<div style=\"font-size:12px;color:var(--muted);margin-bottom:6px;\">\ud83c\udf82 ${escapeHtml(formatBirthday(other.birthday))}<\/div>` : ''}\n        <div style=\"height:1px;background:var(--card-border);margin:2px 0 8px;\"><\/div>\n      `;\n    } else { extra.innerHTML = ''; }\n\n    const list = $('members-list');\n    list.innerHTML = '';\n    members.forEach(m => {\n      const initial = (m.username || m.email || '?')[0].toUpperCase();\n      const row = document.createElement('div');\n      row.className = 'member-row';\n      row.innerHTML = `\n        <div class=\"member-avatar\">${avatarHtml(m, initial)}<\/div>\n        <div>\n          <div class=\"member-name\">${escapeHtml(m.username || '?')}${m.id === currentUser.id ? ' <span style=\"color:var(--muted);font-weight:400;\">(toi)<\/span>' : ''}${isBirthdayToday(m.birthday) ? ' \ud83c\udf82' : ''}<\/div>\n          <div class=\"member-email\">${escapeHtml(m.email)}<\/div>\n        <\/div>\n      `;\n      list.appendChild(row);\n    });\n    openModal('modal-members');\n  }\n\n  // ==================== PROFIL ====================\n  function openProfileModal() {\n    $('profile-username').value = currentUser.username || '';\n    $('profile-bio').value = currentUser.bio || '';\n    $('profile-birthday').value = currentUser.birthday ? ('2000-' + currentUser.birthday) : '';\n    $('profile-avatar-url').value = currentUser.avatar_url || '';\n    $('profile-avatar-preview').innerHTML = avatarHtml(currentUser, (currentUser.username || '?')[0].toUpperCase());\n    $('profile-error').classList.remove('show');\n    openModal('modal-profile');\n  }\n  $('footer-profile-trigger').onclick = openProfileModal;\n  $('profile-cancel').onclick = () => closeModal('modal-profile');\n  $('profile-avatar-url').addEventListener('input', () => {\n    const url = $('profile-avatar-url').value.trim();\n    $('profile-avatar-preview').innerHTML = avatarHtml(url ? { avatar_url: url } : null, (currentUser.username || '?')[0].toUpperCase());\n  });\n\n  $('profile-save').onclick = async () => {\n    const username = $('profile-username').value.trim();\n    const bio = $('profile-bio').value.trim();\n    const birthdayRaw = $('profile-birthday').value;\n    const birthday = birthdayRaw ? birthdayRaw.slice(5) : null;\n    const avatarUrl = $('profile-avatar-url').value.trim();\n    const errEl = $('profile-error');\n    if (!username) { errEl.textContent = \"Le nom d'utilisateur est requis.\"; errEl.classList.add('show'); return; }\n    if (avatarUrl && !/^https?:\\/\\//i.test(avatarUrl)) { errEl.textContent = \"Le lien de la photo doit commencer par http:// ou https://\"; errEl.classList.add('show'); return; }\n    errEl.classList.remove('show');\n    try {\n      const data = await apiFetch('/api/profile', { method: 'PATCH', body: JSON.stringify({ username, bio, birthday, avatar_url: avatarUrl || null }) });\n      currentUser = { ...currentUser, ...(data.user || { username, bio, birthday, avatar_url: avatarUrl || null }) };\n      setStore('msg_current_user', currentUser);\n      updateFooterAvatar();\n      $('footer-name').textContent = currentUser.username;\n      closeModal('modal-profile');\n      renderShell();\n    } catch (err) { errEl.textContent = err.message; errEl.classList.add('show'); }\n  };\n\n  // ==================== ANNIVERSAIRES ====================\n  function checkBirthdays() {\n    if (!currentUser) return;\n    const today = todayMMDD();\n    const seen = new Set();\n    const names = [];\n    const all = [];\n    convsCache.forEach(c => (c.members || []).forEach(m => all.push(m)));\n    all.push(currentUser);\n    all.forEach(m => {\n      if (!m || seen.has(m.id)) return;\n      if (m.birthday === today) { seen.add(m.id); names.push(m.id === currentUser.id ? 'toi' : (m.username || m.email)); }\n    });\n    const banner = $('bday-banner');\n    const dismissedKey = 'msg_bday_dismissed_' + today;\n    if (names.length > 0 && !getStore(dismissedKey, false)) {\n      $('bday-banner-text').textContent = names.length === 1\n        ? `\ud83c\udf89 C'est l'anniversaire de ${names[0]} aujourd'hui !`\n        : `\ud83c\udf89 C'est l'anniversaire de ${names.join(', ')} aujourd'hui !`;\n      banner.classList.add('show');\n    } else { banner.classList.remove('show'); }\n  }\n  $('bday-banner-close').onclick = () => { setStore('msg_bday_dismissed_' + todayMMDD(), true); $('bday-banner').classList.remove('show'); };\n\n  // ==================== UNREAD / ADAPTIVE POLLING ====================\n  let lastConvMessageAt = null;\n  let lastGlobalMessageAt = null;\n  let convPollTimer = null, globalPollTimer = null, presenceTimer = null;\n  let bgLastMessageAt = {}, bgPollTimers = {};\n  let tabVisible = !document.hidden;\n\n  document.addEventListener('visibilitychange', () => {\n    tabVisible = !document.hidden;\n    if (tabVisible) { scheduleConvPoll(0); scheduleGlobalPoll(0); schedulePresencePing(0); }\n  });\n\n  function getPollingInterval(lastAt) {\n    if (!lastAt) return 20_000;\n    const elapsed = Date.now() - lastAt, MIN = 60_000;\n    if (elapsed < 20 * MIN) return 3_000;\n    if (elapsed < 5 * 60 * MIN) return 20_000;\n    if (elapsed < 10 * 60 * MIN) return 5 * MIN;\n    if (elapsed < 30 * 60 * MIN) return 10 * MIN;\n    return 15 * MIN;\n  }\n\n  function resetConvActivity() { lastConvMessageAt = Date.now(); scheduleConvPoll(3_000); }\n  function resetGlobalActivity() { lastGlobalMessageAt = Date.now(); scheduleGlobalPoll(3_000); }\n\n  function scheduleConvPoll(delay) {\n    clearTimeout(convPollTimer);\n    if (!currentUser) return;\n    convPollTimer = setTimeout(runConvPoll, delay ?? getPollingInterval(lastConvMessageAt));\n  }\n  async function runConvPoll() {\n    if (currentUser && activeId && activeKind === 'conv' && tabVisible) await loadConvMessages(activeId);\n    scheduleConvPoll(getPollingInterval(lastConvMessageAt));\n  }\n\n  function scheduleGlobalPoll(delay) {\n    clearTimeout(globalPollTimer);\n    if (!currentUser) return;\n    globalPollTimer = setTimeout(runGlobalPoll, delay ?? getPollingInterval(lastGlobalMessageAt));\n  }\n  async function runGlobalPoll() {\n    if (currentUser && activeKind === 'global' && tabVisible) await loadGlobalMessages();\n    scheduleGlobalPoll(getPollingInterval(lastGlobalMessageAt));\n  }\n\n  function schedulePresencePing(delay = 60_000) {\n    clearTimeout(presenceTimer);\n    if (!currentUser) return;\n    presenceTimer = setTimeout(async () => { if (currentUser) await pingPresence(); schedulePresencePing(60_000); }, delay);\n  }\n\n  function updateUnreadBadges() {\n    renderSidebar();\n    try { parent.postMessage({ type: 'msg-unread', total: Object.entries(unreadByConv).filter(([id]) => id !== activeId).reduce((s, [, n]) => s + n, 0) }, '*'); } catch (e) {}\n  }\n\n  function markConvAsRead(convId, msgs) {\n    if (msgs && msgs.length > 0) {\n      const last = msgs[msgs.length - 1];\n      lastSeenMsgId[convId] = { id: last.id, at: new Date(last.sent_at).getTime() };\n      saveLastSeen();\n    }\n    unreadByConv[convId] = 0;\n    updateUnreadBadges();\n  }\n\n  async function bgPollConv(convId) {\n    if (!currentUser) return;\n    if (convId === activeId && activeKind === 'conv') { scheduleBgPoll(convId); return; }\n    try {\n      const data = await apiFetch('/api/conversations/' + convId + '/messages?peek=1');\n      const msgs = data.messages || [];\n      if (msgs.length > 0) {\n        const newestAt = new Date(msgs[msgs.length - 1].sent_at).getTime();\n        if (!bgLastMessageAt[convId] || newestAt > bgLastMessageAt[convId]) bgLastMessageAt[convId] = newestAt;\n        const lastSeen = lastSeenMsgId[convId];\n        let count = 0, foundById = false;\n        for (let i = msgs.length - 1; i >= 0; i--) {\n          const m = msgs[i];\n          if (lastSeen && m.id === lastSeen.id) { foundById = true; break; }\n          if ((m.sender_id || m.senderId) !== currentUser.id) count++;\n        }\n        if (!foundById && lastSeen && lastSeen.at) {\n          count = 0;\n          for (let i = msgs.length - 1; i >= 0; i--) {\n            const m = msgs[i];\n            if (new Date(m.sent_at).getTime() <= lastSeen.at) break;\n            if ((m.sender_id || m.senderId) !== currentUser.id) count++;\n          }\n        }\n        if (!foundById && lastSeen && !lastSeen.at) count = 0;\n        unreadByConv[convId] = count;\n      }\n    } catch (e) {}\n    updateUnreadBadges();\n    scheduleBgPoll(convId);\n  }\n  function scheduleBgPoll(convId) {\n    clearTimeout(bgPollTimers[convId]);\n    if (!currentUser || convId === activeId) return;\n    bgPollTimers[convId] = setTimeout(() => bgPollConv(convId), getPollingInterval(bgLastMessageAt[convId] || null));\n  }\n  async function startBgPolling() {\n    Object.values(bgPollTimers).forEach(clearTimeout);\n    bgPollTimers = {};\n    if (!currentUser) return;\n    const convs = await getUserConversations();\n    convs.forEach(c => { if (lastSeenMsgId[c.id]) unreadByConv[c.id] = 0; });\n    updateUnreadBadges();\n    convs.forEach(c => { if (c.id !== activeId) bgPollTimers[c.id] = setTimeout(() => bgPollConv(c.id), Math.random() * 2000); });\n  }\n\n  function startAdaptivePolling() {\n    scheduleConvPoll(3_000);\n    scheduleGlobalPoll(20_000);\n    schedulePresencePing(0);\n    startBgPolling();\n  }\n  function stopAllPolling() {\n    clearTimeout(convPollTimer); clearTimeout(globalPollTimer); clearTimeout(presenceTimer);\n    Object.values(bgPollTimers).forEach(clearTimeout);\n    bgPollTimers = {}; unreadByConv = {}; lastSeenMsgId = {}; saveLastSeen(); bgLastMessageAt = {};\n  }\n\n  // ==================== RENDER: SIDEBAR ====================\n  async function renderSidebar() {\n    const list = $('conv-list');\n    list.innerHTML = '';\n\n    const globalRow = document.createElement('div');\n    globalRow.className = 'conv-row' + (activeId === GLOBAL_ID ? ' active' : '');\n    globalRow.innerHTML = `<div class=\"conv-avatar global\">\ud83c\udf10<\/div><div class=\"conv-body\"><div class=\"conv-name\">Chat global<\/div><\/div>`;\n    globalRow.onclick = () => selectConv(GLOBAL_ID, 'global');\n    list.appendChild(globalRow);\n\n    const convs = convsCache;\n    if (convs.length === 0) return;\n\n    const pinnedId = getPinnedConv();\n    const sorted = [...convs].sort((a, b) => (a.id === pinnedId ? -1 : b.id === pinnedId ? 1 : 0));\n\n    sorted.forEach(conv => {\n      const isPinned = conv.id === pinnedId;\n      const unread = unreadByConv[conv.id] || 0;\n      const name = getConvDisplayName(conv);\n      const initial = name.trim()[0]?.toUpperCase() || '?';\n      const others = (conv.members || []).filter(m => m.id !== currentUser.id);\n      const isGroup = (conv.isGroup || conv.is_group) || others.length > 1;\n      const avatarInner = (!isGroup && others[0]) ? avatarHtml(others[0], initial) : escapeHtml(initial);\n      const bday = (!isGroup && others[0]) ? others[0].birthday : null;\n      const row = document.createElement('div');\n      row.className = 'conv-row' + (conv.id === activeId ? ' active' : '') + (isPinned ? ' pinned' : '');\n      row.innerHTML = `\n        <div class=\"conv-avatar\">${avatarInner}<\/div>\n        <div class=\"conv-body\"><div class=\"conv-name\" title=\"${escapeHtml(name)}\">${escapeHtml(name)}${isBirthdayToday(bday) ? ' \ud83c\udf82' : ''}<\/div><\/div>\n        ${unread > 0 ? '<div class=\"conv-dot\"><\/div>' : ''}\n        <div class=\"conv-actions\">\n          <button class=\"icon-btn pin-btn ${isPinned ? 'pinned' : ''}\" title=\"${isPinned ? 'D\u00e9pingler' : '\u00c9pingler'}\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z\"/><\/svg>\n          <\/button>\n          <button class=\"icon-btn rename-btn\" title=\"Renommer\">\n            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z\"/><\/svg>\n          <\/button>\n          <button class=\"icon-btn danger del-btn\" title=\"Supprimer\">\u2715<\/button>\n        <\/div>\n      `;\n      row.querySelector('.pin-btn').onclick = e => { e.stopPropagation(); togglePinConv(conv.id); };\n      row.querySelector('.rename-btn').onclick = e => { e.stopPropagation(); openRenameConv(conv.id); };\n      row.querySelector('.del-btn').onclick = e => { e.stopPropagation(); deleteConv(conv.id); };\n      row.onclick = () => selectConv(conv.id, 'conv');\n      list.appendChild(row);\n    });\n  }\n\n  // ==================== RENDER: MAIN ====================\n  async function renderShell() {\n    convsCache = await getUserConversations();\n    if (activeKind === 'conv' && activeId && !convsCache.find(c => c.id === activeId)) activeId = null;\n    await renderSidebar();\n    await renderMain();\n    checkBirthdays();\n  }\n\n  async function renderMain() {\n    const placeholder = $('placeholder');\n    const messages = $('messages');\n    const inputBar = $('input-bar');\n    const replyBar = $('reply-bar');\n    const membersBtn = $('members-btn');\n\n    if (activeKind === 'global' && activeId === GLOBAL_ID) {\n      placeholder.style.display = 'none';\n      messages.style.display = 'flex';\n      inputBar.style.display = 'flex';\n      membersBtn.style.display = 'flex';\n      membersBtn.onclick = showOnlineMembers;\n      $('chat-header-title').textContent = 'Chat global';\n      $('chat-header-sub').textContent = 'Visible par tous les utilisateurs';\n      $('msg-text').placeholder = 'Message global...';\n      cancelGlobalReply();\n      _globalSig = null;\n      lastGlobalMessageAt = null;\n      scheduleGlobalPoll(0);\n      await loadGlobalMessages();\n      return;\n    }\n\n    if (!activeId) {\n      placeholder.style.display = 'flex';\n      messages.style.display = 'none';\n      inputBar.style.display = 'none';\n      replyBar.classList.remove('show');\n      membersBtn.style.display = 'none';\n      $('chat-header-title').textContent = 'Messages';\n      $('chat-header-sub').textContent = '';\n      return;\n    }\n\n    placeholder.style.display = 'none';\n    messages.style.display = 'flex';\n    inputBar.style.display = 'flex';\n    membersBtn.style.display = 'flex';\n    membersBtn.onclick = showConvMembers;\n    const conv = convsCache.find(c => c.id === activeId);\n    $('chat-header-title').textContent = conv ? getConvDisplayName(conv) : 'Conversation';\n    $('chat-header-sub').textContent = (conv?.members?.length > 2) ? `${conv.members.length} membres` : '';\n    $('msg-text').placeholder = '\u00c9crire un message...';\n    cancelReply();\n    _msgSig = null;\n    lastConvMessageAt = null;\n    scheduleConvPoll(0);\n    await loadConvMessages(activeId, true);\n  }\n\n  async function selectConv(id, kind) {\n    const prevId = activeId;\n    activeId = id; activeKind = kind;\n    if (kind === 'conv') {\n      unreadByConv[id] = 0;\n      if (prevId && prevId !== id && prevId !== GLOBAL_ID) scheduleBgPoll(prevId);\n      clearTimeout(bgPollTimers[id]);\n      delete bgPollTimers[id];\n    }\n    await renderSidebar();\n    await renderMain();\n    openChatMobile();\n  }\n\n  // ==================== MOBILE NAV ====================\n  function openChatMobile() { $('app').classList.add('chat-open'); }\n  function closeChatMobile() { $('app').classList.remove('chat-open'); }\n  $('back-btn').onclick = closeChatMobile;\n\n  // ==================== MODALS ====================\n  function openModal(id) { $(id).classList.add('open'); }\n  function closeModal(id) { $(id).classList.remove('open'); }\n\n  function openNewConvModal() {\n    pendingEmailChips = [];\n    $('email-chips').innerHTML = '';\n    $('new-conv-email').value = '';\n    $('new-conv-error').classList.remove('show');\n    openModal('modal-new-conv');\n    setTimeout(() => $('new-conv-email').focus(), 80);\n  }\n  $('new-conv-btn').onclick = openNewConvModal;\n  $('placeholder-new-conv').onclick = openNewConvModal;\n  $('new-conv-cancel').onclick = () => closeModal('modal-new-conv');\n\n  function renderEmailChips() {\n    const container = $('email-chips');\n    container.innerHTML = '';\n    pendingEmailChips.forEach(email => {\n      const chip = document.createElement('div');\n      chip.className = 'chip';\n      chip.innerHTML = `${escapeHtml(email)} <span>\u00d7<\/span>`;\n      chip.querySelector('span').onclick = () => { pendingEmailChips = pendingEmailChips.filter(e => e !== email); renderEmailChips(); };\n      container.appendChild(chip);\n    });\n  }\n  function addEmailChip() {\n    const input = $('new-conv-email');\n    const email = input.value.trim().toLowerCase();\n    if (!email || !/\\S+@\\S+\\.\\S+/.test(email)) return;\n    if (pendingEmailChips.includes(email) || email === currentUser?.email) { input.value = ''; return; }\n    pendingEmailChips.push(email);\n    renderEmailChips();\n    input.value = '';\n  }\n  $('add-email-chip').onclick = addEmailChip;\n  $('new-conv-email').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addEmailChip(); } });\n\n  $('new-conv-create').onclick = async () => {\n    const inputEmail = $('new-conv-email').value.trim().toLowerCase();\n    if (inputEmail && /\\S+@\\S+\\.\\S+/.test(inputEmail) && !pendingEmailChips.includes(inputEmail) && inputEmail !== currentUser?.email) {\n      pendingEmailChips.push(inputEmail);\n    }\n    if (pendingEmailChips.length === 0) {\n      const errEl = $('new-conv-error');\n      errEl.textContent = 'Entre au moins un email.';\n      errEl.classList.add('show');\n      return;\n    }\n    const wanted = pendingEmailChips.map(x => x.toLowerCase()).sort().join('|');\n    const existing = convsCache.find(c => {\n      const others = (c.members || []).filter(m => m.id !== currentUser.id).map(m => (m.email || '').toLowerCase()).sort().join('|');\n      return others && others === wanted;\n    });\n    const result = existing ? { conv: existing } : await createConvFromEmails(pendingEmailChips);\n    if (result.error) {\n      const errEl = $('new-conv-error');\n      errEl.textContent = result.email ? `Compte non trouv\u00e9 : ${result.email}` : result.error;\n      errEl.classList.add('show');\n      return;\n    }\n    closeModal('modal-new-conv');\n    pendingEmailChips = [];\n    activeId = result.conv.id; activeKind = 'conv';\n    await renderShell();\n    startBgPolling();\n    openChatMobile();\n  };\n\n  function openRenameConv(convId) {\n    $('rename-conv-input').value = '';\n    $('rename-conv-input').dataset.convId = convId;\n    openModal('modal-rename-conv');\n    setTimeout(() => $('rename-conv-input').focus(), 80);\n  }\n  $('rename-cancel').onclick = () => closeModal('modal-rename-conv');\n  $('rename-confirm').onclick = () => {\n    const input = $('rename-conv-input');\n    const convId = input.dataset.convId;\n    const name = input.value.trim();\n    if (!name || !convId) return;\n    setConvCustomName(convId, name);\n    closeModal('modal-rename-conv');\n    renderShell();\n  };\n  $('rename-conv-input').addEventListener('keydown', e => { if (e.key === 'Enter') $('rename-confirm').click(); });\n\n  $('members-close').onclick = () => closeModal('modal-members');\n  document.querySelectorAll('.modal-overlay').forEach(ov => {\n    ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('open'); });\n  });\n\n  // ==================== SEND WIRING ====================\n  $('send-btn').onclick = async () => {\n    const input = $('msg-text');\n    if (!input.value.trim()) return;\n    if (activeKind === 'global') await sendGlobalMessage(input.value);\n    else if (activeId) await sendMessage(activeId, input.value);\n    input.value = '';\n  };\n  $('msg-text').addEventListener('keydown', async e => {\n    if (e.key !== 'Enter') return;\n    const input = e.target;\n    if (!input.value.trim()) return;\n    if (activeKind === 'global') await sendGlobalMessage(input.value);\n    else if (activeId) await sendMessage(activeId, input.value);\n    input.value = '';\n  });\n\n  window.addEventListener('message', e => {\n    if (e.data && e.data.type === 'msg-open-global' && currentUser) selectConv(GLOBAL_ID, 'global');\n  });\n\n  // ==================== INIT ====================\n  (function init() {\n    const savedUser = getStore('msg_current_user', null);\n    const token = getAuthToken();\n    if (savedUser && token) {\n      try {\n        const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));\n        if (payload && payload.id === savedUser.id) { currentUser = savedUser; onLoggedIn(); return; }\n      } catch (e) {}\n      setAuthToken(null);\n      setStore('msg_current_user', null);\n    }\n    try { parent.postMessage({ type: 'msg-auth', loggedIn: false }, '*'); parent.postMessage({ type: 'msg-unread', total: 0 }, '*'); } catch (e) {}\n    $('auth-screen').style.display = 'flex';\n    $('app').style.display = 'none';\n  })();\n\n})();\n<\/script>\n<\/body>\n<\/html>\n";
    const msgFrame = document.getElementById('msg-frame');
    const msgExpandIcon = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;
    const msgReduceIcon = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;
    document.getElementById('msg-fullscreen-btn').innerHTML = msgExpandIcon;
    msgFrame.srcdoc = MSG_APP_HTML;
    function sendMsgTheme() {
      if (msgFrame.contentWindow) msgFrame.contentWindow.postMessage({ type: 'msg-theme', theme: document.documentElement.getAttribute('data-theme') }, '*');
    }
    msgFrame.addEventListener('load', sendMsgTheme);
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (getStore('app_theme', '"system"') === 'system') applyTheme('system');
    });

    function toggleMsgWindow() {
      const win = document.getElementById('msg-window');
      win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
    }
    function toggleMsgFullscreen() {
      const win = document.getElementById('msg-window');
      win.classList.toggle('fullscreen');
      document.getElementById('msg-fullscreen-btn').innerHTML = win.classList.contains('fullscreen') ? msgReduceIcon : msgExpandIcon;
    }
    window.addEventListener('message', (e) => {
      if (e.source !== msgFrame.contentWindow || !e.data) return;
      if (e.data.type === 'msg-ready') sendMsgTheme();
      else if (e.data.type === 'msg-unread') {
        const badge = document.getElementById('msg-unread-badge');
        const n = e.data.total || 0;
        badge.textContent = n > 99 ? '99+' : n;
        badge.style.display = n > 0 ? 'block' : 'none';
      } else if (e.data.type === 'msg-auth') {
        document.getElementById('msg-status-dot').classList.toggle('online', !!e.data.loggedIn);
        if (typeof renderAccount === 'function') renderAccount();
      } else if (e.data.type === 'msg-open-settings') {
        if (typeof openAccountSettings === 'function') openAccountSettings();
      }
    });

    let shareNoteText = null;
    function getCurrentUser() {
      try {
        const u = JSON.parse(localStorage.getItem('msg_current_user') || 'null');
        return (u && getAuthToken()) ? u : null;
      } catch(e) { return null; }
    }
    async function getUserConversations() {
      if (!getCurrentUser()) return [];
      try {
        const data = await apiFetch('/api/conversations');
        const blacklist = JSON.parse(localStorage.getItem('msg_deleted_convs') || '[]');
        return (data.conversations || []).filter(c => !blacklist.includes(c.id));
      } catch(e) { console.error('getUserConversations:', e); return []; }
    }
    function getConvDisplayName(conv) {
      const me = getCurrentUser();
      if (!me) return conv.name || 'Conversation';
      let customNames = {};
      try { customNames = JSON.parse(localStorage.getItem('msg_custom_names') || '{}'); } catch(e) {}
      const custom = customNames[me.id + '_' + conv.id];
      if (custom) return custom;
      const others = (conv.members || []).filter(m => m.id !== me.id);
      if (others.length > 0) return others.map(m => m.username || m.email).join(', ');
      return conv.name || 'Conversation';
    }
    async function sendMessage(convId, text) {
      if (!text.trim() || !getCurrentUser()) return;
      try {
        await apiFetch('/api/conversations/' + convId + '/messages', { method: 'POST', body: JSON.stringify({ text: text.trim() }) });
      } catch(e) { console.error('sendMessage error:', e); alert('Erreur envoi : ' + e.message); }
    }

    // ==================== PARTAGE DE NOTES ====================
    window.openShareNote = async function(noteText) {
      shareNoteText = noteText;
      const list = document.getElementById('share-target-list');
      list.innerHTML = '';
      if (!getCurrentUser()) {
        list.innerHTML = '<div style="font-size:12px;color:var(--muted);">Connecte-toi d\'abord.</div>';
        openModal('modal-share-note');
        return;
      }
      const convs = await getUserConversations();
      if (convs.length === 0) {
        list.innerHTML = '<div style="font-size:12px;color:var(--muted);">Aucune conversation disponible.</div>';
      }
      convs.forEach(conv => {
        const item = document.createElement('label');
        item.className = 'share-item';
        item.innerHTML = `<input type="checkbox" value="${conv.id}"> ${getConvDisplayName(conv)}`;
        list.appendChild(item);
      });
      openModal('modal-share-note');
    };

    async function executeShareNote() {
      if (!shareNoteText || !getCurrentUser()) { closeModal('modal-share-note'); return; }
      const checkboxes = document.querySelectorAll('#share-target-list input[type="checkbox"]:checked');
      for (const cb of checkboxes) {
        await sendMessage(cb.value, `📎 Note partagée :\n${shareNoteText}`);
      }
      closeModal('modal-share-note');
      shareNoteText = null;
      if (checkboxes.length > 0) {
        const btn = document.querySelector('.action-btn.share-note-trigger');
        if (btn) { btn.innerHTML = '?'; setTimeout(() => renderNotes(), 1200); }
      }
    }

    // ==================== MODALS HELPERS ====================
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('open'); });
    });

    // ==================== NOTES (avec bouton partage) ====================
    let notesHidden = false;

    const notesBtn = document.getElementById('notesBtn');
    const notesMenu = document.getElementById('notesMenu');
    const noteArrow = document.getElementById('noteArrow');
    const noteArea = document.getElementById('noteArea');
    const pinBtn = document.getElementById('pinNote');
    const clearNotesBtn = document.getElementById('clearNotes');
    const toggleNotesBtn = document.getElementById('toggleNotes');
    const overlay = document.getElementById('noteOverlay');
    const closeBtnScreen = document.getElementById('closeBtnScreen');

    notesBtn.onclick = () => {
      const isVisible = notesMenu.style.display === 'flex';
      notesMenu.style.display = isVisible ? 'none' : 'flex';
      noteArrow.classList.toggle('active', !isVisible);
    };

    toggleNotesBtn.onclick = () => {
      notesHidden = !notesHidden;
      const lang = getStore('app_lang', '"fr"');
      toggleNotesBtn.textContent = notesHidden ? translations[lang].btnShow : translations[lang].btnHide;
      renderNotes();
    };

    pinBtn.onclick = () => {
      const text = noteArea.value.trim();
      if(!text) return;
      let notes = getStore('pinned_notes');
      if(notes.length >= 20) { alert(translations[getStore('app_lang', '"fr"')].notesLimit); return; }
      notes.push({ id: Date.now(), text: text });
      setStore('pinned_notes', notes);
      const fits = renderNotes();
      if(!fits) {
        notes.pop(); setStore('pinned_notes', notes); renderNotes();
        alert(translations[getStore('app_lang', '"fr"')].notesFull);
      } else { noteArea.value = ''; }
    };

    clearNotesBtn.onclick = () => {
      const lang = getStore('app_lang', '"fr"');
      if(confirm(translations[lang].confirmAllNotesDel)) { setStore('pinned_notes', []); renderNotes(); }
    };

    function renderNotes() {
      const notes = getStore('pinned_notes');
      const leftCont = document.getElementById('pinnedLeft');
      const rightCont = document.getElementById('pinnedRight');
      const notice = document.getElementById('hiddenNotice');
      const lang = getStore('app_lang', '"fr"');

      if (notesHidden) {
        leftCont.style.display = 'none'; rightCont.style.display = 'none';
        if (notes.length > 0) { notice.style.display = 'block'; notice.textContent = notes.length + translations[lang].msgHidden; }
        else { notice.style.display = 'none'; }
        return true;
      } else {
        leftCont.style.display = 'flex'; rightCont.style.display = 'flex'; notice.style.display = 'none';
      }

      leftCont.innerHTML = ''; rightCont.innerHTML = '';

      notes.forEach((note, idx) => {
        const noteEl = document.createElement('div');
        noteEl.className = 'pinned-note';
        noteEl.innerHTML = `
          <div class="note-content" style="-webkit-line-clamp: 10;">${note.text}</div>
          <div class="note-actions">
            <button class="action-btn edit" title="Modifier"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
            <button class="action-btn share-note-trigger" title="Partager" onclick="openShareNote(${JSON.stringify(note.text).replace(/"/g, '&quot;')})">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
            <button class="action-btn del" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
          </div>
        `;

        const content = noteEl.querySelector('.note-content');
        const editBtn = noteEl.querySelector('.edit');
        const delBtn = noteEl.querySelector('.del');

        noteEl.onclick = (e) => {
          if(!e.target.closest('.action-btn') && content.getAttribute('contenteditable') !== 'true') expandNote(noteEl);
        };

        delBtn.onclick = (e) => {
          e.stopPropagation();
          if(content.getAttribute('contenteditable') === 'true') { renderNotes(); return; }
          if(confirm(translations[lang].confirmNoteDel)) {
            let nArr = getStore('pinned_notes').filter(n => n.id !== note.id);
            setStore('pinned_notes', nArr); renderNotes();
          }
        };

        editBtn.onclick = (e) => {
          e.stopPropagation();
          if(content.getAttribute('contenteditable') !== 'true') {
            expandNote(noteEl);
            content.setAttribute('contenteditable', 'true');
            content.focus();
            editBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
            editBtn.classList.add('save');
            const validate = () => { editBtn.classList.toggle('disabled', content.innerText.trim().length === 0); };
            content.oninput = validate; validate();
          } else {
            if(editBtn.classList.contains('disabled')) return;
            content.setAttribute('contenteditable', 'false');
            let nArr = getStore('pinned_notes');
            let nObj = nArr.find(n => n.id === note.id);
            if(nObj) nObj.text = content.innerText;
            setStore('pinned_notes', nArr); renderNotes();
          }
        };

        if (idx % 2 === 0) leftCont.appendChild(noteEl);
        else rightCont.appendChild(noteEl);
      });

      function shrinkColumn(container) {
        let list = Array.from(container.children);
        let maxIter = 1000;
        while(maxIter-- > 0) {
          if(list.length === 0) return true;
          let last = list[list.length - 1];
          let bottom = last.getBoundingClientRect().bottom;
          if(bottom < window.innerHeight - 30) return true;
          let maxC = 1; let target = null;
          list.forEach(n => {
            let content = n.querySelector('.note-content');
            if(content.getAttribute('contenteditable') === 'true') return;
            let c = parseInt(content.style.webkitLineClamp || 10);
            if(c > maxC) { maxC = c; target = content; }
          });
          if(!target) return false;
          target.style.webkitLineClamp = maxC - 1;
        }
        return false;
      }

      let fitL = shrinkColumn(leftCont);
      let fitR = shrinkColumn(rightCont);
      return fitL && fitR;
    }

    function expandNote(el) {
      const currentExpanded = document.querySelector('.pinned-note.expanded');
      if (currentExpanded && currentExpanded !== el) currentExpanded.classList.remove('expanded');
      el.classList.add('expanded');
      overlay.style.display = 'block'; closeBtnScreen.style.display = 'flex';
      const close = (e) => {
        if(e) e.stopPropagation();
        if(el.querySelector('.note-content').getAttribute('contenteditable') === 'true' && e && e.target === overlay) return;
        el.classList.remove('expanded');
        overlay.style.display = 'none'; closeBtnScreen.style.display = 'none';
        overlay.onclick = null; closeBtnScreen.onclick = null;
        if(el.querySelector('.note-content').getAttribute('contenteditable') === 'true') renderNotes();
      };
      closeBtnScreen.onclick = close; overlay.onclick = close;
    }

    // ==================== BACKGROUND ====================

    if(bgUpload) {
      bgUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => { const b = event.target.result; setStore('app_custom_bg', b); applyBg(b); };
          reader.readAsDataURL(file);
        }
      });
    }

      clearBgBtn.addEventListener('click', () => { setStore('app_custom_bg', ""); applyBg(""); bgUpload.value = ""; });
    }
