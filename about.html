    // ==================== URL MANAGER ====================
    const urlInput = document.getElementById('url');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsMenu = document.getElementById('settingsMenu');
    const gearIcon = document.getElementById('gearIcon');
    const addFavBtn = document.getElementById('addFav');
    const clearHistoryBtn = document.getElementById('clearHistory');

    settingsBtn.onclick = () => {
      const isVisible = settingsMenu.style.display === 'flex';
      settingsMenu.style.display = isVisible ? 'none' : 'flex';
      gearIcon.classList.toggle('active', !isVisible);
    };

    function getFavs() {
      return getStore('favs').map(f => typeof f === 'string' ? { url: f, name: '', cfg: null } : f);
    }
    function saveFavs(f) { setStore('favs', f); }
    function currentCfg() {
      return {
        cloak: document.getElementById('cloakSelect').value,
        openMode: document.getElementById('openModeSelect').value,
        method: document.getElementById('methodSelect').value
      };
    }
    function applyCfg(cfg) {
      if (!cfg) return;
      const set = (id, val, storeKey) => {
        const el = document.getElementById(id);
        if (val && [...el.options].some(o => o.value === val)) {
          el.value = val;
          if (storeKey) setStore(storeKey, val);
        }
      };
      set('cloakSelect', cfg.cloak);
      set('openModeSelect', cfg.openMode, 'app_open_mode');
      set('methodSelect', cfg.method, 'app_method');
    }
    function updateFavStar() {
      const u = urlInput.value.trim();
      addFavBtn.textContent = getFavs().some(f => f.url === u) ? '★' : '☆';
    }
    urlInput.oninput = updateFavStar;

    addFavBtn.onclick = () => {
      const url = urlInput.value.trim(); if(!url) return;
      let f = getFavs();
      if (f.some(x => x.url === url)) f = f.filter(x => x.url !== url);
      else f.push({ url, name: '', cfg: currentCfg() });
      saveFavs(f); init(); updateFavStar();
    };
    addFavBtn.oncontextmenu = (e) => {
      e.preventDefault();
      const url = urlInput.value.trim(); if(!url) return;
      let f = getFavs();
      const existing = f.find(x => x.url === url);
      const name = prompt('Nom du favori :', existing ? (existing.name || existing.url) : url);
      if (name === null) return;
      const clean = name.trim();
      if (existing) existing.name = (clean === existing.url) ? '' : clean;
      else f.push({ url, name: (clean === url) ? '' : clean, cfg: currentCfg() });
      saveFavs(f); init(); updateFavStar();
    };

    clearHistoryBtn.onclick = () => {
      if(confirm(translations[getStore('app_lang', '"fr"')].confirmClearHist)) { setStore('hist', []); init(); }
    };

    function renderList(element, data, isFav) {
      const lang = getStore('app_lang', '"fr"');
      element.innerHTML = data.length ? '' : `<li style="font-size:11px; opacity:0.5">${translations[lang].empty}</li>`;
      data.forEach((entry, index) => {
        const url = isFav ? entry.url : entry;
        const li = document.createElement('li'); li.className = 'item';
        const textSpan = document.createElement('span'); textSpan.className = 'url-text';
        textSpan.textContent = isFav ? (entry.name || entry.url) : url;
        if (isFav) textSpan.title = entry.url;
        textSpan.onclick = () => { urlInput.value = url; if (isFav) applyCfg(entry.cfg); updateFavStar(); };
        const delBtn = document.createElement('span'); delBtn.className = 'btn-del'; delBtn.textContent = '×';
        delBtn.onclick = () => { if (isFav) removeFav(index); else deleteHistory(index); };
        li.appendChild(textSpan); li.appendChild(delBtn); element.appendChild(li);
      });
    }

    window.removeFav = (idx) => { let f = getFavs(); f.splice(idx,1); saveFavs(f); init(); updateFavStar(); };
    window.deleteHistory = (idx) => { let h = getStore('hist'); h.splice(idx,1); setStore('hist', h); init(); };

    function init() {
      renderList(document.getElementById('historyList'), getStore('hist'), false);
      renderList(document.getElementById('favList'), getFavs(), true);
      renderNotes(); updateFavStar();
    }

    function looksLikeUrl(t) {
      if (/\s/.test(t)) return false;
      if (/^[a-z][a-z0-9+.-]*:\/\//i.test(t)) return true;
      if (/^localhost(:\d+)?([\/?#]|$)/i.test(t)) return true;
      if (/^\d{1,3}(\.\d{1,3}){3}(:\d+)?([\/?#]|$)/.test(t)) return true;
      return /^([a-z0-9-]+\.)+[a-z]{2,}(:\d+)?([\/?#]|$)/i.test(t);
    }
    function resolveUrl(raw) {
      if (!raw) return null;
      if (looksLikeUrl(raw)) return normalize(/^[a-z][a-z0-9+.-]*:\/\//i.test(raw) ? raw : 'https://' + raw);
      return 'https://www.google.com/search?q=' + encodeURIComponent(raw) + '&igu=1';
    }

    function normalize(u){
      let norm;
      try{ norm = new URL(u).toString(); }
      catch{ try{ norm = new URL('https://'+u).toString(); } catch { return null; } }
      if (norm.includes("youtube.com/watch?v=")) norm = norm.replace("youtube.com", "youtube.ttools.io");
      return norm;
    }

    const cloaks = {
      none: { title: 'about:blank', icon: 'https://www.google.com/s2/favicons?sz=64&domain=about:blank' },
      google: { title: 'Google', icon: 'https://www.google.com/favicon.ico' },
      drive: { title: 'Mon Disque - Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      docs: { title: 'Google Docs', icon: 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico' },
      classroom: { title: 'Accueil - Classroom', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      gmail: { title: 'Boîte de réception', icon: 'https://www.google.com/a/cpanel/educrm.ca/images/favicon.ico' },
      desmos: { title: 'Desmos | Testing', icon: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGxcgDGvvNikiUHVkRgGrFkCdRgKQw_4wLUg&s' },
      wordreference: { title: 'English to French Dictionary - WordReference.com', icon: 'https://alfred.app/workflows/alexmartinfr/wordreference/icon.png' },
      usito: { title: 'Dictionnaire Usito', icon: 'https://usito.usherbrooke.ca/favicon.ico' },
      formative: { title: 'Formative', icon: 'https://www.google.com/s2/favicons?sz=64&domain=app.formative.com' }
    };

    function applyCloakToWindow(w, cloakKey) {
      if(cloaks[cloakKey]) {
        w.document.title = cloaks[cloakKey].title;
        const link = w.document.createElement('link'); link.rel = 'icon'; link.href = cloaks[cloakKey].icon;
        w.document.head.appendChild(link);
      }
    }

    const REMOTE_FRAME_SANDBOX = 'allow-scripts allow-forms allow-popups allow-modals allow-downloads';

    function htmlWithBase(html, baseUrl) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      let base = doc.querySelector('base');
      if (!base) {
        base = doc.createElement('base');
        doc.head.prepend(base);
      }
      base.setAttribute('href', baseUrl);
      return '<!doctype html>\n' + doc.documentElement.outerHTML;
    }

    function appendRemoteFrame(container, url) {
      const frame = document.createElement('iframe');
      frame.setAttribute('sandbox', REMOTE_FRAME_SANDBOX);
      frame.style.cssText = "width:100%; height:100%; border:none;";
      frame.src = url;
      container.appendChild(frame);
    }

    async function buildWindowContent(w, url, method) {
      w.document.body.style.cssText = "height:100vh; margin:0; overflow:hidden; background:#000;";
      if (method === 'iframe' || method === 'object') {
        appendRemoteFrame(w.document.body, url);
      } else if(method === 'cors') {
        try {
          const proxyUrl = "https://cors-anywhere.herokuapp.com/";
          const res = await fetch(proxyUrl + url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const html = await res.text();
          const frame = w.document.createElement('iframe');
          frame.setAttribute('sandbox', REMOTE_FRAME_SANDBOX);
          frame.style.cssText = "width:100%; height:100%; border:none;";
          frame.srcdoc = htmlWithBase(html, res.url || url);
          w.document.body.appendChild(frame);
        } catch(e) { alert("Erreur Proxy CORS. Activez sur https://cors-anywhere.herokuapp.com/corsdemo"); w.close(); return false; }
      } else {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const html = await res.text();
          const frame = w.document.createElement('iframe');
          frame.setAttribute('sandbox', REMOTE_FRAME_SANDBOX);
          frame.style.cssText = "width:100%; height:100%; border:none;";
          frame.srcdoc = htmlWithBase(html, res.url || url);
          w.document.body.appendChild(frame);
        } catch(e) { alert("CORS Error. Utilisez la méthode CORS Anywhere ou iFrame."); w.close(); return false; }
      }
      return true;
    }

    let currentPageLoad = 0;
    function closeCurrentPageViewer() {
      const viewer = document.getElementById('currentPageViewer');
      currentPageLoad++;
      document.getElementById('currentPageContent').replaceChildren();
      viewer.hidden = true;
    }

    async function openInCurrentPage(url, method) {
      const viewer = document.getElementById('currentPageViewer');
      const content = document.getElementById('currentPageContent');
      const lang = getStore('app_lang', '"fr"');
      const t = translations[lang] || translations.fr;
      closeCurrentPageViewer();
      const loadId = currentPageLoad;
      viewer.hidden = false;
      document.getElementById('currentPageTitle').textContent = url;

      if (method === 'iframe' || method === 'object') {
        appendRemoteFrame(content, url);
      } else {
        try {
          const target = method === 'cors' ? 'https://cors-anywhere.herokuapp.com/' + url : url;
          const response = await fetch(target);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const html = await response.text();
          if (loadId !== currentPageLoad) return;
          const frame = document.createElement('iframe');
          frame.title = url;
          frame.setAttribute('sandbox', REMOTE_FRAME_SANDBOX);
          frame.srcdoc = htmlWithBase(html, response.url || url);
          content.appendChild(frame);
        } catch (error) {
          if (loadId !== currentPageLoad) return;
          console.error(error);
          alert(method === 'cors' ? t.currentPageCorsErr : t.currentPageFetchErr);
          closeCurrentPageViewer();
        }
      }
    }

    document.getElementById('closeCurrentPage').onclick = closeCurrentPageViewer;

    document.getElementById('open').onclick = async () => {
      const url = resolveUrl(urlInput.value.trim());
      const lang = getStore('app_lang', '"fr"');
      if(!url) return alert(translations[lang].invalidUrl);
      let h = getStore('hist').filter(u => u !== url); h.unshift(url);
      setStore('hist', h.slice(0, 10)); init();

      const cloakKey = document.getElementById('cloakSelect').value;
      const method = document.getElementById('methodSelect').value;
      const openMode = document.getElementById('openModeSelect').value;

      if (openMode === 'current') {
        await openInCurrentPage(url, method);
      } else if(openMode === 'file') {
        const iframeHtml = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>${cloaks[cloakKey] ? cloaks[cloakKey].title : 'about:blank'}</title>
  <link rel="icon" href="${cloaks[cloakKey] ? cloaks[cloakKey].icon : ''}">
  <style>* { margin:0; padding:0; } html,body { width:100%; height:100%; overflow:hidden; background:#000; }</style>
</head>
<body>
  <iframe sandbox="${REMOTE_FRAME_SANDBOX}" src="${url}" style="width:100%;height:100vh;border:none;"></iframe>
</body>
</html>`;
        const blob = new Blob([iframeHtml], { type: 'text/html' });
        const blobUrl = URL.createObjectURL(blob);
        window.open(blobUrl, '_blank', 'noopener,noreferrer');
        setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      } else {
        const w = window.open('about:blank', '_blank');
        if (!w) return;
        w.opener = null;
        applyCloakToWindow(w, cloakKey);
        const ok = await buildWindowContent(w, url, method);
        if(ok) w.document.close();
      }
    };

    urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('open').click(); });

    document.getElementById('openNew').onclick = () => {
      const url = resolveUrl(urlInput.value.trim());
      if(url) { let h = getStore('hist').filter(u => u !== url); h.unshift(url); setStore('hist', h.slice(0, 10)); init(); window.open(url, '_blank', 'noopener,noreferrer'); }
    };

    document.getElementById('clearAll').onclick = () => {
      if(confirm(translations[getStore('app_lang', '"fr"')].confirmReset)) { localStorage.clear(); (typeof wipeAppsData === 'function' ? wipeAppsData() : Promise.resolve()).then(() => location.reload()); }
    };

    const savedTheme = getStore('app_theme', '"system"');
    const savedLang = getStore('app_lang', '"fr"');
    const savedBg = getStore('app_custom_bg', '""');

    document.getElementById('themeSelect').value = savedTheme;
    document.getElementById('langSelect').value = savedLang;

    applyTheme(savedTheme); applyLang(savedLang); applyBg(savedBg);

    document.getElementById('themeSelect').onchange = (e) => { setStore('app_theme', e.target.value); applyTheme(e.target.value); };
    document.getElementById('langSelect').onchange = (e) => { setStore('app_lang', e.target.value); applyLang(e.target.value); };

    const savedOpenMode = getStore('app_open_mode', '"blank"');
    const savedMethod = getStore('app_method', '"iframe"');
    document.getElementById('openModeSelect').value = savedOpenMode;
    document.getElementById('methodSelect').value = savedMethod;
    document.getElementById('openModeSelect').onchange = (e) => setStore('app_open_mode', e.target.value);
    document.getElementById('methodSelect').onchange = (e) => setStore('app_method', e.target.value);
  </script>

  <script>
    // ==================== IA (GEMINI + GROQ + NVIDIA, via le worker) ====================
    let geminiChats = getStore('gemini_chats');
    let currentChatId = null;

    const AI_PROVIDERS = { gemini: 'Gemini', groq: 'Groq', nvidia: 'NVIDIA', cloudflare: 'Cloudflare' };
    const AI_ORDER = ['gemini', 'groq', 'nvidia', 'cloudflare'];
    // Modèle choisi par IA : gardé en mémoire seulement (on revient au modèle récent en rafraîchissant la page)
    const aiState = {}; // provider -> { override, latest, used, older }
    const AI_RETRY_CODES = ['PROVIDER_BUSY', 'MODEL_GONE', 'PROVIDER_ERROR'];

    // Les clés API ne sont plus dans le site : le worker Cloudflare les garde en secret et appelle les IA
    async function callAI(provider, messages, system) {
      const token = getAuthToken();
      if (!token) throw Object.assign(new Error('Connexion requise'), { code: 'AUTH_REQUIRED' });
      const st = aiState[provider] || (aiState[provider] = {});
      const res = await fetch(WORKER_URL + '/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ provider, messages, system, model: st.override || undefined })
      });
      const data = await res.json().catch(() => ({}));
      if (data.latest) st.latest = data.latest;
      if (!res.ok) throw Object.assign(new Error(data.error || ('Erreur ' + res.status)), { code: data.code || '', status: res.status, older: data.older || [] });
      st.used = data.model;
      st.older = data.older || [];
      if (st.override) st.override = data.model; // si le modèle choisi a été retiré, le worker en a pris un autre
      return data.text;
    }
    function aiErrorText(err, provider, t) {
      if (err && err.code === 'AUTH_REQUIRED') return t.aiNeedLogin;
      return t.aiErrWord + ' ' + (AI_PROVIDERS[provider] || provider) + ' : ' + ((err && err.message) || '?');
    }

    const chatWindow = document.getElementById('chat-window');
    const messagesDiv = document.getElementById('chat-messages');
    const aiInput = document.getElementById('ai-input');
    const aiSend = document.getElementById('ai-send');
    const btnFullscreen = document.getElementById('fullscreenChatBtn');

    const expandIcon = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;
    const reduceIcon = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="4 14 10 14 10 20"></polyline><polyline points="20 10 14 10 14 4"></polyline><line x1="14" y1="10" x2="21" y2="3"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>`;

    const aiProviderBtn = document.getElementById('aiProviderBtn');
    let currentAiProvider = localStorage.getItem('ai_provider') || 'gemini';
    if (!AI_PROVIDERS[currentAiProvider]) currentAiProvider = 'gemini';

    // "Gemini" si on utilise le modèle récent, "Gemini: nom-du-modèle" si on a choisi un modèle antérieur
    function aiOlderModel(p) { const st = aiState[p]; return st && st.override && st.override !== st.latest ? st.override : null; }
    function updateAiProviderBtn() {
      const m = aiOlderModel(currentAiProvider);
      aiProviderBtn.textContent = AI_PROVIDERS[currentAiProvider] + (m ? ': ' + m.split('/').pop() : '');
      aiProviderBtn.title = m || '';
      aiProviderBtn.style.maxWidth = '200px';
      aiProviderBtn.style.overflow = 'hidden';
      aiProviderBtn.style.textOverflow = 'ellipsis';
      aiProviderBtn.style.whiteSpace = 'nowrap';
    }

    window.cycleAiProvider = function() {
      currentAiProvider = AI_ORDER[(AI_ORDER.indexOf(currentAiProvider) + 1) % AI_ORDER.length];
      localStorage.setItem('ai_provider', currentAiProvider);
      updateAiProviderBtn();
    };

    updateAiProviderBtn();

    window.toggleChat = function() {
      const isVisible = chatWindow.style.display === 'flex';
      chatWindow.style.display = isVisible ? 'none' : 'flex';
      if(!isVisible) { aiInput.focus(); renderChatHistory(); }
    };

    btnFullscreen.onclick = () => {
      chatWindow.classList.toggle('fullscreen');
      btnFullscreen.innerHTML = chatWindow.classList.contains('fullscreen') ? reduceIcon : expandIcon;
      if(chatWindow.classList.contains('fullscreen')) renderChatHistory();
    };

    const INFO_CHAT_ID = 'info-chat-persistent';
    let isInfoChat = false;

    const INFO_SYSTEM_PROMPT = `Tu es un assistant intégré à l'application "about:blank". Tu réponds UNIQUEMENT en te basant sur les fonctionnalités de cette application. Si une question ne concerne pas l'application, réponds que tu ne peux répondre qu'aux questions sur l'app.

Voici les fonctionnalités de l'application :
- Ouverture de sites web en mode caché via : iFrame, Object (Blob), CORS Anywhere, Inject (Fetch)
- Deux modes d'ouverture : "about:blank" (classique) et "Fichier" (anti-Blocksi, ouvre dans une origine file:// pour éviter l'injection de Blocksi)
- Camouflage d'onglet (cloak) : change le titre et l'icône de l'onglet ouvert pour ressembler à Google, Drive, Docs, Classroom, Gmail, Desmos, WordReference, Usito, ou Formative
- Bouton "Ouvrir (Caché)" : ouvre le site en mode caché selon le mode et la méthode choisis
- Bouton "Normal" : ouvre le site dans un nouvel onglet normalement
- Favoris : sauvegarde et suppression d'URLs favorites
- Historique : 10 dernières URLs visitées, effaçable
- Notes épinglables : créer, modifier, supprimer, masquer, partager des notes. Les notes s'affichent sur les côtés de l'écran
- Fond d'écran personnalisable : choisir une image locale ou la retirer
- Thème : sombre, clair, ou système
- Langue : français ou anglais
- Chat IA : Gemini (Google), Groq (LLaMA), NVIDIA ou Cloudflare, sélectionnable via le bouton à gauche de la barre de message. Historique de conversations persistant, partagé entre les IA (on peut changer d'IA en cours de conversation). Nécessite d'être connecté (Réglages > Compte). Si une IA est saturée, un bouton « Réessayer avec un modèle antérieur » apparaît sous l'erreur ; le modèle choisi s'affiche à côté du nom de l'IA jusqu'au rafraîchissement de la page
- Chat INFO (ce chat) : assistant dédié aux questions sur l'application, basé sur Groq
- Messagerie : conversations privées et chat global via le serveur. Nécessite un compte (inscription/connexion dans Réglages)
- App : galerie d'apps HTML (ajouter un fichier .html avec nom et icône optionnels), ouverture en plein écran dans la page, boutons − (réduire, l'app reste active), □ (fenêtre déplaçable et redimensionnable) et ✕ (fermer)
- Réglages : thème, langue, fond d'écran, compte utilisateur (connexion à la messagerie et à l'IA), bouton de réinitialisation complète
- Paramètre "Mode d'ouverture" : choisir entre about:blank et Fichier (anti-Blocksi)
- Paramètre "Méthode" : iFrame, Object, CORS Anywhere, Inject
- Paramètre "Onglet" : camouflage du titre/icône de l'onglet ouvert
Réponds toujours en français sauf si l'utilisateur écrit en anglais.`;

    let infoChatMessages = JSON.parse(localStorage.getItem('info_chat_messages') || '[]');

    window.loadInfoChat = function() {
      isInfoChat = true;
      currentChatId = INFO_CHAT_ID;
      messagesDiv.innerHTML = '';
      const t = translations[getStore('app_lang', '"fr"')];
      document.getElementById('info-chat-item').classList.add('active');
      document.getElementById('global-chat-item')?.classList.remove('active');
      document.querySelectorAll('#chat-history-list .chat-hist-item').forEach(el => el.classList.remove('active'));
      document.getElementById('aiProviderBtn').style.display = 'none';
      if(infoChatMessages.length > 0) {
        infoChatMessages.forEach(m => {
          const side = m.role === 'user' ? 'user-msg' : 'ai-msg';
          const divId = appendMsg('', side);
          const div = document.getElementById(divId);
          if(m.role === 'ai') {
            const b64Raw = btoa(encodeURIComponent(m.text));
            div.innerHTML = `<div class="markdown-body">${marked.parse(m.text)}</div>
              <button class="save-note-btn" onclick="saveAsNote(this)" data-raw="${b64Raw}" title="Sauvegarder en note"><img src="https://static.thenounproject.com/png/3248069-200.png" alt="Note"></button>`;
          } else { div.innerText = m.text; }
        });
      } else {
        messagesDiv.innerHTML = `<div class="msg-chat ai-msg" id="ai-welcome">Bonjour ! Pose-moi tes questions sur les fonctionnalités de l'application.</div>`;
      }
      setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 50);
    };

    function initChat() {
      if(geminiChats.length === 0) {
        currentChatId = Date.now().toString();
        geminiChats.push({ id: currentChatId, title: 'Chat', messages: [] });
        setStore('gemini_chats', geminiChats);
      } else { currentChatId = geminiChats[0].id; }
      loadChat(currentChatId);
    }

    function renderChatHistory() {
      const list = document.getElementById('chat-history-list');
      list.innerHTML = '';
      geminiChats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `chat-hist-item ${chat.id === currentChatId ? 'active' : ''}`;
        item.innerHTML = `<span class="chat-title-text">${chat.title}</span><span class="del-chat-btn" title="Supprimer">✕</span>`;
        item.onclick = () => loadChat(chat.id);
        item.querySelector('.del-chat-btn').onclick = (e) => {
          e.stopPropagation();
          geminiChats = geminiChats.filter(c => c.id !== chat.id);
          setStore('gemini_chats', geminiChats);
          if(currentChatId === chat.id) {
            if(geminiChats.length > 0) loadChat(geminiChats[0].id);
            else {
              currentChatId = Date.now().toString();
              geminiChats.push({ id: currentChatId, title: 'Chat', messages: [] });
              setStore('gemini_chats', geminiChats);
              loadChat(currentChatId);
            }
          } else renderChatHistory();
        };
        list.appendChild(item);
      });
    }

    document.getElementById('btn-new-chat').onclick = () => {
      currentChatId = Date.now().toString();
      geminiChats.unshift({ id: currentChatId, title: 'Chat', messages: [] });
      setStore('gemini_chats', geminiChats);
      loadChat(currentChatId);
    };

    window.openGlobalChatFromAI = function() {
      document.getElementById('info-chat-item').classList.remove('active');
      document.getElementById('global-chat-item')?.classList.add('active');
      document.querySelectorAll('#chat-history-list .chat-hist-item').forEach(el => el.classList.remove('active'));
      const msgWindow = document.getElementById('msg-window');
      if (msgWindow.style.display !== 'flex') {
        msgWindow.style.display = 'flex';
      }
      msgFrame.contentWindow && msgFrame.contentWindow.postMessage({ type: 'msg-open-global' }, '*');
    };

    function loadChat(id) {
      isInfoChat = false;
      currentChatId = id;
      document.getElementById('info-chat-item').classList.remove('active');
      document.getElementById('global-chat-item')?.classList.remove('active');
      document.getElementById('aiProviderBtn').style.display = '';
      const chat = geminiChats.find(c => c.id === id);
      messagesDiv.innerHTML = '';
      const t = translations[getStore('app_lang', '"fr"')];
      if(chat && chat.messages.length > 0) {
        chat.messages.forEach(m => {
          const side = m.role === 'user' ? 'user-msg' : 'ai-msg';
          const divId = appendMsg('', side);
          const div = document.getElementById(divId);
          if(m.role === 'ai') {
            const b64Raw = btoa(encodeURIComponent(m.text));
            div.innerHTML = `
              <div class="markdown-body">${marked.parse(m.text)}</div>
              <button class="save-note-btn" onclick="saveAsNote(this)" data-raw="${b64Raw}" title="Sauvegarder en note">
                <img src="https://static.thenounproject.com/png/3248069-200.png" alt="Note">
              </button>
            `;
          } else { div.innerText = m.text; }
        });
      } else {
        messagesDiv.innerHTML = `<div class="msg-chat ai-msg" id="ai-welcome">${t.aiWelcome}</div>`;
      }
      renderChatHistory();
      setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 50);
    }

    function saveMessageToChat(role, text) {
      let chat = geminiChats.find(c => c.id === currentChatId);
      if(!chat) { chat = { id: currentChatId, title: 'Chat', messages: [] }; geminiChats.unshift(chat); }
      if(chat.messages.length === 0 && role === 'user') {
        chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
      }
      chat.messages.push({ role, text });
      setStore('gemini_chats', geminiChats);
      renderChatHistory();
    }

    window.saveAsNote = function(btn) {
      try {
        let notes = getStore('pinned_notes');
        if(notes.length >= 20) { alert(translations[getStore('app_lang', '"fr"')].notesLimit); return; }
        const rawText = decodeURIComponent(atob(btn.getAttribute('data-raw')));
        notes.push({ id: Date.now(), text: rawText });
        setStore('pinned_notes', notes);
        const fits = renderNotes();
        if(!fits) {
          notes.pop(); setStore('pinned_notes', notes); renderNotes();
          alert(translations[getStore('app_lang', '"fr"')].notesFull); return;
        }
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<span style="color: var(--success); font-size: 16px; font-weight: bold; line-height: 1;">✓</span>`;
        setTimeout(() => { btn.innerHTML = originalHTML; }, 1500);
      } catch(e) { console.error("Erreur sauvegarde :", e); }
    };

    function showAnswer(aiDiv, raw, provider) {
      const b64Raw = btoa(encodeURIComponent(raw));
      aiDiv.innerHTML = `<div class="markdown-body">${marked.parse(raw)}</div>
        <button class="save-note-btn" onclick="saveAsNote(this)" data-raw="${b64Raw}" title="Sauvegarder en note"><img src="https://static.thenounproject.com/png/3248069-200.png" alt="Note"></button>`;
      aiDiv.classList.remove('typing');
      const m = aiOlderModel(provider);
      if (m) { const n = document.createElement('div'); n.className = 'ai-model-note'; n.textContent = m; aiDiv.appendChild(n); }
    }

    // Erreur : si c'est une saturation / un modèle retiré, un bouton propose de réessayer avec un modèle antérieur
    function showError(aiDiv, err, provider, retry) {
      const t = translations[getStore('app_lang', '"fr"')];
      aiDiv.classList.remove('typing');
      aiDiv.innerText = aiErrorText(err, provider, t);
      if (!err || !AI_RETRY_CODES.includes(err.code)) return;
      const hint = document.createElement('div');
      if (err.older && err.older.length) {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'ai-retry-btn';
        btn.textContent = t.aiRetryOlder;
        btn.title = err.older[0];
        btn.onclick = () => {
          const st = aiState[provider] || (aiState[provider] = {});
          st.override = err.older[0];
          updateAiProviderBtn();
          retry();
        };
        aiDiv.appendChild(btn);
      } else {
        hint.className = 'ai-model-note';
        hint.textContent = t.aiNoOlder;
        aiDiv.appendChild(hint);
      }
    }

    async function runAI(provider, getMessages, system, onAnswer, aiDiv) {
      const t = translations[getStore('app_lang', '"fr"')];
      aiDiv.classList.add('typing');
      aiDiv.innerText = t.aiThinking;
      try {
        const raw = await callAI(provider, getMessages(), system);
        onAnswer(raw);
        showAnswer(aiDiv, raw, provider);
      } catch (error) {
        console.error(error);
        showError(aiDiv, error, provider, () => runAI(provider, getMessages, system, onAnswer, aiDiv));
      }
      updateAiProviderBtn(); // le nom du modèle affiché suit ce que le worker a réellement utilisé
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function handleChat() {
      const text = aiInput.value.trim();
      if(!text) return;
      const t = translations[getStore('app_lang', '"fr"')];
      const welcome = document.getElementById('ai-welcome');
      if(welcome) welcome.remove();
      appendMsg(text, 'user-msg');
      aiInput.value = '';

      let provider, system, getMessages, onAnswer;
      if(isInfoChat) {
        infoChatMessages.push({ role: 'user', text });
        localStorage.setItem('info_chat_messages', JSON.stringify(infoChatMessages));
        provider = 'groq';
        system = INFO_SYSTEM_PROMPT;
        getMessages = () => infoChatMessages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
        onAnswer = raw => { infoChatMessages.push({ role: 'ai', text: raw }); localStorage.setItem('info_chat_messages', JSON.stringify(infoChatMessages)); };
      } else {
        provider = currentAiProvider;
        saveMessageToChat('user', text);
        getMessages = () => geminiChats.find(c => c.id === currentChatId).messages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));
        onAnswer = raw => saveMessageToChat('ai', raw);
      }
      const msgId = appendMsg(t.aiThinking, 'ai-msg');
      await runAI(provider, getMessages, system, onAnswer, document.getElementById(msgId));
    }

    function appendMsg(text, side) {
      const id = 'ai-' + Date.now() + Math.random().toString(36).slice(2);
      const div = document.createElement('div');
      div.className = `msg-chat ${side}`; div.id = id; div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return id;
    }

    aiSend.onclick = handleChat;
    aiInput.onkeypress = (e) => { if(e.key === 'Enter') handleChat(); };

    // ==================== INIT GLOBAL ====================
    async function appInit() {
      initChat();
    }

    appInit();
  </script>

  <script>
  (function () {
    'use strict';
    // ==================== APPS : galerie de fichiers HTML ====================
    // Métadonnées (nom, icône, options) -> localStorage ; contenu des fichiers -> IndexedDB
    const META_KEY = 'ab_apps_meta', DB_NAME = 'ab_apps', DB_STORE = 'files';
    const MAX_SIZE = 25 * 1024 * 1024, ICON_MAX = 20000, MINW = 320, MINH = 220;
    const $ = id => document.getElementById(id);
    const curLang = () => { try { const l = getStore('app_lang', '"fr"'); return translations[l] ? l : 'fr'; } catch (e) { return 'fr'; } };
    const T = () => translations[curLang()];
    const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8));

    // ---------- métadonnées ----------
    function loadMeta() { try { const a = JSON.parse(localStorage.getItem(META_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
    function saveMeta(list) { try { localStorage.setItem(META_KEY, JSON.stringify(list)); return true; } catch (e) { return false; } }
    let apps = loadMeta();

    // ---------- IndexedDB ----------
    let dbp = null, dbInst = null;
    function openDb() {
      if (dbp) return dbp;
      dbp = new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, 1);
        r.onupgradeneeded = () => { r.result.createObjectStore(DB_STORE, { keyPath: 'id' }); };
        r.onsuccess = () => { dbInst = r.result; dbInst.onversionchange = () => { try { dbInst.close(); } catch (e) {} dbInst = null; dbp = null; }; res(dbInst); };
        r.onerror = () => rej(r.error || new Error('IndexedDB'));
        r.onblocked = () => rej(new Error('IndexedDB bloquée'));
      });
      dbp.catch(() => { dbp = null; });
      return dbp;
    }
    async function dbTx(mode, fn) {
      const db = await openDb();
      return new Promise((res, rej) => {
        const t = db.transaction(DB_STORE, mode);
        let out;
        const req = fn(t.objectStore(DB_STORE));
        if (req) req.onsuccess = () => { out = req.result; };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
        t.onabort = () => rej(t.error || new Error('abort'));
      });
    }
    const dbPut = (id, content) => dbTx('readwrite', st => st.put(Object.assign({ id }, content)));
    const dbGet = id => dbTx('readonly', st => st.get(id));
    const dbDel = id => dbTx('readwrite', st => st.delete(id));

    // Utilisé par « Tout réinitialiser » : ferme la connexion puis supprime la base
    function wipeAppsData() {
      return new Promise(resolve => {
        try {
          if (dbInst) { try { dbInst.close(); } catch (e) {} dbInst = null; }
          dbp = null;
          const r = indexedDB.deleteDatabase(DB_NAME);
          r.onsuccess = r.onerror = () => resolve();
          setTimeout(resolve, 1500);
        } catch (e) { resolve(); }
      });
    }

    // ---------- nom / icône ----------
    const dispName = a => ((a.name || '').trim() || a.base || 'App');
    const dispIcon = a => ((a.iconUrl || '').trim() || a.autoIcon || '');

    function normIcon(raw) {
      raw = (raw || '').trim();
      if (!raw) return '';
      if (/^data:image\//i.test(raw) || /^https?:\/\//i.test(raw)) return raw;
      if (/^\/\//.test(raw)) return 'https:' + raw;
      if (/^[^\s\/]+\.[^\s]+$/.test(raw) && !/^[a-z][a-z0-9+.-]*:/i.test(raw)) return 'https://' + raw;
      return null; // invalide
    }

    // Icône déclarée dans le fichier HTML (<link rel="icon">), si exploitable
    function extractIcon(html) {
      try {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const links = Array.from(doc.querySelectorAll('link[rel]')).filter(l => /(^|\s)icon(\s|$)|apple-touch-icon/i.test(l.getAttribute('rel') || ''));
        links.sort((a, b) => (/apple/i.test(a.getAttribute('rel')) ? 1 : 0) - (/apple/i.test(b.getAttribute('rel')) ? 1 : 0));
        for (const l of links) {
          const h = (l.getAttribute('href') || '').trim();
          if (!h) continue;
          if (/^https?:\/\//i.test(h)) return h;
          if (h.startsWith('//')) return 'https:' + h;
          if (/^data:image\//i.test(h) && h.length <= ICON_MAX) return h;
        }
      } catch (e) {}
      return '';
    }

    function fillIcon(box, a) {
      box.textContent = '';
      box.classList.remove('letter');
      const url = dispIcon(a);
      const letter = () => { box.textContent = (dispName(a)[0] || '?').toUpperCase(); box.classList.add('letter'); };
      if (url) {
        const img = document.createElement('img');
        img.alt = ''; img.referrerPolicy = 'no-referrer';
        img.onerror = () => { img.remove(); letter(); };
        img.src = url;
        box.appendChild(img);
      } else letter();
    }
    function iconEl(a, cls) { const b = document.createElement('div'); b.className = cls; fillIcon(b, a); return b; }

    // ---------- galerie ----------
    const running = {}; // id -> { el, iframe, mode: 'full'|'window'|'min', prev, blobUrl }
    const launching = new Set();
    let zTop = 3000;

    function renderApps() {
      const grid = $('appsGrid'); if (!grid) return;
      const t = T();
      grid.innerHTML = '';
      apps.forEach(a => {
        const r = running[a.id];
        const tile = document.createElement('div');
        tile.className = 'app-tile' + (r ? ' running' : '') + (r && r.mode === 'min' ? ' bg' : '');
        tile.title = dispName(a) + (r && r.mode === 'min' ? ' — ' + t.appBackground : '');
        const menu = document.createElement('button');
        menu.className = 'app-tile-menu'; menu.type = 'button'; menu.textContent = '⋯'; menu.title = t.appEdit;
        menu.onclick = e => { e.stopPropagation(); openAppModal(a.id); };
        tile.appendChild(menu);
        tile.appendChild(iconEl(a, 'app-icon'));
        const nm = document.createElement('div'); nm.className = 'app-name'; nm.textContent = dispName(a);
        tile.appendChild(nm);
        const dot = document.createElement('div'); dot.className = 'app-dot';
        tile.appendChild(dot);
        tile.onclick = () => launchApp(a.id);
        grid.appendChild(tile);
      });
      const add = document.createElement('div');
      add.className = 'app-tile add'; add.title = t.appAdd;
      const plus = document.createElement('div'); plus.className = 'app-icon plus'; plus.textContent = '+';
      const nm = document.createElement('div'); nm.className = 'app-name'; nm.textContent = t.appAdd;
      add.appendChild(plus); add.appendChild(nm);
      add.onclick = () => openAppModal(null);
      grid.appendChild(add);
      $('appsEmpty').style.display = apps.length ? 'none' : 'block';
      const n = Object.keys(running).length, c = $('appsRunning');
      c.style.display = n ? 'inline-flex' : 'none'; c.textContent = n;
    }

    $('appsBtn').onclick = () => {
      const menu = $('appsMenu');
      const visible = menu.style.display === 'flex';
      menu.style.display = visible ? 'none' : 'flex';
      $('appsArrow').classList.toggle('active', !visible);
    };

    // ---------- fenêtres ----------
    const ICONS = {
      min: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
      square: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>',
      full: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9V5h4M19 9V5h-4M5 15v4h4M19 15v4h-4"/></svg>',
      close: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
    };
    const vw = () => window.innerWidth, vh = () => window.innerHeight;
    const effMode = r => (r.mode === 'min' ? (r.prev || 'full') : r.mode);

    function clampGeom(g) {
      const W = vw(), H = vh();
      const w = Math.max(Math.min(g.w, W), Math.min(MINW, W));
      const h = Math.max(Math.min(g.h, H), Math.min(MINH, H));
      return { x: Math.min(Math.max(g.x, 0), W - w), y: Math.min(Math.max(g.y, 0), H - h), w, h };
    }
    function setGeom(el, g) { el.style.left = g.x + 'px'; el.style.top = g.y + 'px'; el.style.width = g.w + 'px'; el.style.height = g.h + 'px'; }
    function styleGeom(el) { return { x: parseFloat(el.style.left) || 0, y: parseFloat(el.style.top) || 0, w: parseFloat(el.style.width) || MINW, h: parseFloat(el.style.height) || MINH }; }
    function defaultGeom() {
      const W = vw(), H = vh();
      const w = Math.min(900, Math.round(W * 0.72)), h = Math.min(640, Math.round(H * 0.72));
      const off = (Object.keys(running).length % 6) * 26;
      return clampGeom({ x: Math.round((W - w) / 2) + off, y: Math.round((H - h) / 2) + off, w, h });
    }
    function saveGeom(id, g) {
      const a = apps.find(x => x.id === id); if (!a) return;
      a.win = { x: Math.round(g.x), y: Math.round(g.y), w: Math.round(g.w), h: Math.round(g.h) };
      saveMeta(apps);
    }

    function updateTop() {
      let best = null, bz = -1;
      Object.values(running).forEach(r => { if (r.mode !== 'min') { const z = parseInt(r.el.style.zIndex || '0', 10); if (z > bz) { bz = z; best = r; } } });
      Object.values(running).forEach(r => r.el.classList.toggle('top', r === best));
    }
    function focusApp(id) {
      const r = running[id]; if (!r) return;
      if (zTop > 8500) { zTop = 3000; Object.values(running).forEach(x => { x.el.style.zIndex = ++zTop; }); }
      r.el.style.zIndex = ++zTop;
      updateTop();
    }
    function updateBodyLock() {
      const full = Object.values(running).some(r => r.mode === 'full');
      document.body.style.overflow = full ? 'hidden' : '';
    }
    function labelWin(r) {
      const t = T();
      const q = s => r.el.querySelector('[data-act="' + s + '"]');
      q('min').title = t.appMin;
      q('close').title = t.appClose;
      const sz = q('size');
      sz.innerHTML = effMode(r) === 'window' ? ICONS.full : ICONS.square;
      sz.title = effMode(r) === 'window' ? t.appToFull : t.appToWindow;
    }
    function refreshWinHeader(id) {
      const r = running[id], a = apps.find(x => x.id === id); if (!r || !a) return;
      const title = r.el.querySelector('.app-win-title');
      title.textContent = '';
      title.appendChild(iconEl(a, 'app-icon xs'));
      const nm = document.createElement('span'); nm.className = 'app-win-name'; nm.textContent = dispName(a);
      title.appendChild(nm);
      r.iframe.title = dispName(a);
    }

    function setMode(id, mode) {
      const r = running[id], a = apps.find(x => x.id === id); if (!r || !a) return;
      if (mode === 'min') { if (r.mode !== 'min') r.prev = r.mode; } else { r.prev = mode; }
      r.mode = mode;
      const eff = effMode(r);
      r.el.classList.toggle('is-full', eff === 'full');
      r.el.classList.toggle('is-window', eff === 'window');
      r.el.classList.toggle('is-min', mode === 'min');
      if (eff === 'window') setGeom(r.el, clampGeom(a.win || defaultGeom()));
      else { r.el.style.left = r.el.style.top = r.el.style.width = r.el.style.height = ''; }
      labelWin(r);
      updateBodyLock();
      if (mode !== 'min') focusApp(id); else updateTop();
      renderApps();
    }

    function closeApp(id) {
      const r = running[id]; if (!r) return;
      try { r.iframe.src = 'about:blank'; } catch (e) {}
      r.el.remove();
      try { URL.revokeObjectURL(r.blobUrl); } catch (e) {}
      delete running[id];
      updateBodyLock(); updateTop(); renderApps();
    }

    function sandboxFor(a) {
      let s = 'allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads allow-orientation-lock allow-presentation';
      if (a.allowStorage) s += ' allow-same-origin';
      return s;
    }

    function buildWindow(a) {
      const el = document.createElement('div');
      el.className = 'app-win is-full';
      el.dataset.id = a.id;
      el.innerHTML =
        '<div class="app-win-bar"><div class="app-win-title"></div><div class="app-win-btns">' +
        '<button class="app-wb" data-act="min" type="button">' + ICONS.min + '</button>' +
        '<button class="app-wb" data-act="size" type="button">' + ICONS.square + '</button>' +
        '<button class="app-wb close" data-act="close" type="button">' + ICONS.close + '</button>' +
        '</div></div>' +
        '<div class="app-win-body"><iframe class="app-frame"></iframe></div>' +
        ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw'].map(d => '<div class="app-rs ' + d + '" data-dir="' + d + '"></div>').join('');
      return el;
    }

    function wireWindow(id, r) {
      const el = r.el, bar = el.querySelector('.app-win-bar');
      el.querySelector('[data-act="min"]').onclick = () => setMode(id, 'min');
      el.querySelector('[data-act="size"]').onclick = () => setMode(id, effMode(r) === 'full' ? 'window' : 'full');
      el.querySelector('[data-act="close"]').onclick = () => closeApp(id);
      el.addEventListener('pointerdown', () => { if (running[id] && r.mode !== 'min') focusApp(id); }, true);
      bar.addEventListener('dblclick', e => { if (e.target.closest('.app-wb')) return; setMode(id, effMode(r) === 'full' ? 'window' : 'full'); });

      // Déplacement (mode fenêtre)
      bar.addEventListener('pointerdown', e => {
        if (e.target.closest('.app-wb') || r.mode !== 'window') return;
        e.preventDefault();
        const g0 = styleGeom(el), sx = e.clientX, sy = e.clientY;
        document.body.classList.add('app-interacting');
        try { bar.setPointerCapture(e.pointerId); } catch (err) {}
        const move = ev => setGeom(el, clampGeom({ x: g0.x + ev.clientX - sx, y: g0.y + ev.clientY - sy, w: g0.w, h: g0.h }));
        const up = () => {
          bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.removeEventListener('pointercancel', up);
          document.body.classList.remove('app-interacting');
          saveGeom(id, styleGeom(el));
        };
        bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up); bar.addEventListener('pointercancel', up);
      });

      // Redimensionnement (poignées)
      el.querySelectorAll('.app-rs').forEach(h => {
        h.addEventListener('pointerdown', e => {
          if (r.mode !== 'window') return;
          e.preventDefault(); e.stopPropagation();
          const dir = h.dataset.dir, g0 = styleGeom(el), sx = e.clientX, sy = e.clientY, W = vw(), H = vh();
          document.body.classList.add('app-interacting');
          try { h.setPointerCapture(e.pointerId); } catch (err) {}
          const move = ev => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            let left = g0.x, top = g0.y, right = g0.x + g0.w, bottom = g0.y + g0.h;
            if (dir.includes('e')) right += dx;
            if (dir.includes('w')) left += dx;
            if (dir.includes('s')) bottom += dy;
            if (dir.includes('n')) top += dy;
            left = Math.max(0, left); top = Math.max(0, top); right = Math.min(W, right); bottom = Math.min(H, bottom);
            if (right - left < MINW) { if (dir.includes('w')) left = right - MINW; else right = left + MINW; }
            if (bottom - top < MINH) { if (dir.includes('n')) top = bottom - MINH; else bottom = top + MINH; }
            if (right > W) { right = W; left = right - MINW; }
            if (bottom > H) { bottom = H; top = bottom - MINH; }
            setGeom(el, { x: left, y: top, w: right - left, h: bottom - top });
          };
          const up = () => {
            h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
            document.body.classList.remove('app-interacting');
            saveGeom(id, styleGeom(el));
          };
          h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
        });
      });
    }

    async function launchApp(id) {
      const a = apps.find(x => x.id === id); if (!a) return;
      const r0 = running[id];
      if (r0) { if (r0.mode === 'min') setMode(id, r0.prev || 'full'); else focusApp(id); return; }
      if (launching.has(id)) return;
      launching.add(id);
      let usesFileHandle = false;
      try {
        const rec = await dbGet(id);
        if (!rec) { alert(T().appLoadErr); return; }
        let source;
        if (typeof rec.html === 'string') {
          source = new Blob([rec.html], { type: 'text/html' });
        } else if (rec.handle && typeof rec.handle.getFile === 'function') {
          usesFileHandle = true;
          let permission = await rec.handle.queryPermission({ mode: 'read' });
          if (permission !== 'granted') permission = await rec.handle.requestPermission({ mode: 'read' });
          if (permission !== 'granted') {
            const error = new Error('File permission denied');
            error.code = 'FILE_PERMISSION_DENIED';
            throw error;
          }
          source = await rec.handle.getFile();
        } else {
          alert(T().appLoadErr);
          return;
        }
        const blobUrl = URL.createObjectURL(source);
        const el = buildWindow(a);
        const iframe = el.querySelector('iframe');
        iframe.setAttribute('sandbox', sandboxFor(a));
        iframe.setAttribute('allow', 'autoplay; fullscreen; clipboard-write; gamepad');
        const r = { el, iframe, mode: 'full', prev: 'full', blobUrl };
        running[id] = r;
        $('appsRoot').appendChild(el);
        refreshWinHeader(id);
        wireWindow(id, r);
        iframe.src = blobUrl;
        setMode(id, 'full');
      } catch (error) {
        console.error(error);
        const t = T();
        alert(error.code === 'FILE_PERMISSION_DENIED' ? t.appFilePermissionErr : (usesFileHandle ? t.appFileAccessErr : t.appLoadErr));
      } finally { launching.delete(id); }
    }

    window.addEventListener('resize', () => {
      Object.values(running).forEach(r => { if (effMode(r) === 'window') setGeom(r.el, clampGeom(styleGeom(r.el))); });
    });

    // ---------- modale ajout / modification ----------
    let editingId = null, pending = null;
    function setErr(msg) { const e = $('appError'); e.textContent = msg || ''; e.classList.toggle('show', !!msg); }
    function updatePreview() {
      const a = editingId ? apps.find(x => x.id === editingId) : null;
      const n = normIcon($('appIconUrl').value);
      fillIcon($('appIconPreview'), {
        name: $('appName').value,
        base: pending ? pending.base : (a ? a.base : ''),
        iconUrl: n || '',
        autoIcon: pending ? pending.autoIcon : (a ? a.autoIcon : '')
      });
    }
    function openAppModal(id) {
      editingId = id; pending = null; setErr('');
      const a = id ? apps.find(x => x.id === id) : null, t = T();
      $('appModalTitle').textContent = a ? t.appModalEdit : t.appModalAdd;
      $('appFile').value = '';
      $('appFileBtn').textContent = a ? t.appReplaceFile : t.appChooseFile;
      $('appFileName').textContent = a ? (a.file || a.base) + (a.size > MAX_SIZE ? t.appLargeFileLabel : '') : t.appNoFile;
      $('appName').value = a ? (a.name || '') : '';
      $('appName').placeholder = a ? a.base : t.appNamePh;
      $('appIconUrl').value = a ? (a.iconUrl || '') : '';
      $('appAllowStorage').checked = !!(a && a.allowStorage);
      $('appDelete').style.display = a ? '' : 'none';
      $('appSave').textContent = a ? t.appSaveBtn : t.appCreate;
      $('appSave').disabled = false;
      updatePreview();
      $('modal-app').classList.add('open');
    }
    function closeAppModal() { $('modal-app').classList.remove('open'); }

    async function selectAppFile(file, handle) {
      setErr('');
      pending = null;
      const t = T();
      if (!/\.(html?|xhtml)$/i.test(file.name) && file.type !== 'text/html') { setErr(t.appErrType); return; }
      if (file.size > MAX_SIZE && !handle) { setErr(t.appErrSize); return; }
      const base = file.name.replace(/\.(html?|xhtml)$/i, '') || 'App';
      let html = null;
      if (file.size <= MAX_SIZE) {
        try { html = await file.text(); } catch (error) { console.error(error); setErr(t.appErrType); return; }
        if (!html || !html.trim()) { setErr(t.appErrType); return; }
      }
      pending = {
        html, handle: file.size > MAX_SIZE ? handle : null, file: file.name, base,
        autoIcon: html ? extractIcon(html) : '', size: file.size
      };
      $('appFileName').textContent = file.name + (file.size > MAX_SIZE ? t.appLargeFileLabel : '');
      $('appName').placeholder = base;
      updatePreview();
    }
    async function chooseAppFile() {
      setErr('');
      if (typeof window.showOpenFilePicker !== 'function') { $('appFile').click(); return; }
      try {
        const [handle] = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: 'Fichier HTML', accept: { 'text/html': ['.html', '.htm', '.xhtml'] } }]
        });
        await selectAppFile(await handle.getFile(), handle);
      } catch (error) {
        if (error.name === 'AbortError') return;
        console.error(error);
        setErr(T().appFileAccessErr);
      }
    }
    $('appFileBtn').onclick = chooseAppFile;
    $('appFile').onchange = async e => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try { await selectAppFile(file, null); }
      finally { e.target.value = ''; }
    };
    $('appName').addEventListener('input', updatePreview);
    $('appIconUrl').addEventListener('input', updatePreview);
    $('appCancel').onclick = closeAppModal;
    $('modal-app').addEventListener('click', e => { if (e.target === $('modal-app')) closeAppModal(); });

    $('appSave').onclick = async () => {
      setErr('');
      const t = T(), a = editingId ? apps.find(x => x.id === editingId) : null;
      if (!a && !pending) { setErr(t.appErrFile); return; }
      const iconRaw = $('appIconUrl').value.trim();
      let iconUrl = '';
      if (iconRaw) { const n = normIcon(iconRaw); if (!n) { setErr(t.appErrIcon); return; } iconUrl = n; }
      const rec = a ? Object.assign({}, a) : { id: uid(), addedAt: Date.now() };
      rec.name = $('appName').value.trim();
      rec.iconUrl = iconUrl;
      rec.allowStorage = $('appAllowStorage').checked;
      if (pending) { rec.file = pending.file; rec.base = pending.base; rec.autoIcon = pending.autoIcon; rec.size = pending.size; }
      const htmlChanged = !!pending;
      $('appSave').disabled = true;
      try {
        if (pending) await dbPut(rec.id, pending.handle ? { handle: pending.handle } : { html: pending.html });
        const next = a ? apps.map(x => x.id === rec.id ? rec : x) : apps.concat([rec]);
        if (!saveMeta(next)) { if (!a) await dbDel(rec.id).catch(() => {}); throw new Error('meta'); }
        apps = next;
      } catch (err) { setErr(t.appErrStorage); $('appSave').disabled = false; return; }
      $('appSave').disabled = false;
      if (running[rec.id]) {
        if (htmlChanged || !!a.allowStorage !== rec.allowStorage) closeApp(rec.id); else refreshWinHeader(rec.id);
      }
      closeAppModal();
      renderApps();
    };

    $('appDelete').onclick = async () => {
      if (!editingId) return;
      if (!confirm(T().appConfirmDelete)) return;
      const id = editingId;
      closeApp(id);
      try { await dbDel(id); } catch (e) {}
      apps = apps.filter(x => x.id !== id);
      saveMeta(apps);
      closeAppModal();
      renderApps();
    };

    // ---------- langue ----------
    function applyAppsLang() {
      const t = T();
      $('titleApps').textContent = t.titleApps;
      $('appIconUrl').placeholder = t.appIconPh;
      $('appAllowLabel').textContent = t.appAllow;
      $('appAllowHint').textContent = t.appAllowHint;
      $('appCancel').textContent = t.appCancel;
      $('appDelete').textContent = t.appDelete;
      $('appsEmpty').textContent = t.appEmpty;
      Object.values(running).forEach(labelWin);
      renderApps();
    }

    window.applyAppsLang = applyAppsLang;
    window.wipeAppsData = wipeAppsData;
    applyAppsLang();
  })();
  </script>
  <script>
  (function () {
    'use strict';
    // ==================== COMPTE (messagerie + IA) dans les Réglages ====================
    const $ = id => document.getElementById(id);
    const T = () => { try { return translations[getStore('app_lang', '"fr"')] || translations.fr; } catch (e) { return translations.fr; } };
    let registerMode = false;

    function currentUser() {
      try { const u = JSON.parse(localStorage.getItem('msg_current_user') || 'null'); return (u && getAuthToken()) ? u : null; }
      catch (e) { return null; }
    }
    function setErr(msg) { const e = $('accError'); e.textContent = msg || ''; e.classList.toggle('show', !!msg); }

    function render() {
      const u = currentUser(), t = T();
      $('accLoggedOut').style.display = u ? 'none' : 'block';
      $('accLoggedIn').style.display = u ? 'block' : 'none';
      $('labelAccount').textContent = t.accTitle;
      $('accEmail').placeholder = t.accEmail;
      $('accPw').placeholder = t.accPw;
      $('accUsername').placeholder = t.accUser;
      $('accUsername').style.display = registerMode ? 'block' : 'none';
      $('accSubmit').textContent = registerMode ? t.accRegister : t.accLogin;
      $('accSwitchText').textContent = registerMode ? t.accHaveAccount : t.accNoAccount;
      $('accToggle').textContent = registerMode ? t.accSignIn : t.accCreate;
      $('accLogout').textContent = t.accLogout;
      if (u) $('accWho').textContent = t.accConnectedAs.replace('{name}', u.username || u.email) + (u.email ? ' (' + u.email + ')' : '');
    }

    // La messagerie est dans une iframe : on la recharge pour qu'elle prenne en compte la connexion
    function reloadMsgFrame() {
      try { msgFrame.srcdoc = MSG_APP_HTML; } catch (e) {}
    }

    async function submit() {
      const email = $('accEmail').value.trim().toLowerCase();
      const pw = $('accPw').value.trim();
      const username = $('accUsername').value.trim() || email.split('@')[0];
      if (!email || !pw) return;
      setErr('');
      $('accSubmit').disabled = true;
      try {
        const data = registerMode
          ? await apiFetch('/api/register', { method: 'POST', body: JSON.stringify({ email, password: pw, username }) })
          : await apiFetch('/api/login', { method: 'POST', body: JSON.stringify({ email, password: pw }) });
        localStorage.setItem('cf_jwt', data.token);
        localStorage.setItem('msg_current_user', JSON.stringify(data.user));
        $('accPw').value = '';
        render();
        reloadMsgFrame();
      } catch (err) {
        const t = T();
        const msgs = { EMAIL_EXISTS: t.accErrExists, WEAK_PASSWORD: t.accErrWeak, INVALID_EMAIL: t.accErrEmail, INVALID_CREDENTIALS: t.accErrCreds };
        setErr(msgs[err.code] || err.message);
      } finally { $('accSubmit').disabled = false; }
    }

    function logout() {
      localStorage.removeItem('cf_jwt');
      localStorage.setItem('msg_current_user', 'null');
      const dot = $('msg-status-dot'); if (dot) dot.classList.remove('online');
      const badge = $('msg-unread-badge'); if (badge) badge.style.display = 'none';
      render();
      reloadMsgFrame();
    }

    $('accSubmit').onclick = submit;
    [$('accEmail'), $('accPw'), $('accUsername')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
    $('accToggle').onclick = () => { registerMode = !registerMode; setErr(''); render(); };
    $('accLogout').onclick = logout;

    // Appelé par la messagerie quand on clique sur « Ouvrir les Réglages »
    window.openAccountSettings = function () {
      const mw = $('msg-window'); if (mw) mw.style.display = 'none';
      settingsMenu.style.display = 'flex';
      gearIcon.classList.add('active');
      const box = $('accountBox');
      if (box && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const f = currentUser() ? null : $('accEmail');
      if (f) setTimeout(() => f.focus(), 250);
    };
    window.renderAccount = render;
    render();
  })();
  </script>
  <script>
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = '';
    });
  </script>
</body>
