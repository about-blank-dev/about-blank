<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>about:blank</title>

  <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/free-open-in-new-icon-svg-download-png-1513791.png">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --card-border: #333333;
      --text: #e6eef6;
      --muted: #9aa4b2;
      --accent: #ffffff;
      --btn-text: #000000;
      --item-bg: #1a1a1a;
      --input-bg: #000;
      --danger: #ff5252;
      --success: #4caf50;
      --icon-invert: 1;
    }

    [data-theme="light"] {
      --bg: #f0f2f5;
      --card: #ffffff;
      --card-border: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #1f2937;
      --btn-text: #ffffff;
      --item-bg: #f9fafb;
      --input-bg: #ffffff;
      --icon-invert: 0;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: 'Inter', -apple-system, sans-serif; transition: background 0.3s, color 0.3s; }

    body {
      display: flex;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 24px;
      min-height: 100vh;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .main-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    h1 { margin: 0 0 15px; font-size: 18px; text-align: center; }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .section-icon { font-size: 15px; font-weight: 900; display: inline-block; line-height: 1; }

    .row { display: flex; gap: 10px; margin-bottom: 12px; }
    input[type="url"], input[type="text"], input[type="email"], input[type="password"], textarea {
      flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--card-border);
      background: var(--input-bg); color: inherit; outline: none; font-family: inherit;
    }
    input[type="url"]:focus, input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus, textarea:focus { border-color: var(--accent); }

    #addFav {
      font-size: 20px; padding: 0; padding-bottom: 2px; width: 45px; height: 45px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, color 0.2s; line-height: 1;
    }
    #addFav:hover { transform: scale(1.2); color: #ffca28; }

    #clearHistory { padding: 2px 8px; font-size: 10px; cursor: pointer; transition: transform 0.2s; }
    #clearHistory:hover { color: var(--danger); }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    label.toggle {
      display: flex; align-items: center; gap: 8px; padding: 10px;
      border-radius: 8px; border: 1px solid var(--card-border);
      cursor: pointer; background: var(--item-bg); font-size: 13px;
    }

    select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--card-border); background: var(--input-bg); color: inherit; outline: none; cursor: pointer; font-size: 12px;}

    .footer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    @media (max-width:600px){ .footer-grid { grid-template-columns: 1fr; } }

    .history-list, .fav-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
    .item {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 10px;
      border-radius: 8px; background: var(--item-bg); font-size: 12px;
    }

    .url-text { cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 140px; opacity: 0.8; }
    .url-text:hover { opacity: 1; color: var(--accent); }

    .btn-del { cursor: pointer; font-size: 16px; color: var(--muted); padding: 0 4px; transition: transform 0.2s; }
    .btn-del:hover { color: var(--danger); transform: scale(1.3); }

    .settings-box, .notes-box { padding: 12px 20px; }
    .settings-header, .notes-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .settings-header h2, .notes-header h2 { margin: 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .notes-trigger { fill: var(--muted); transition: transform 0.4s; }
    .notes-trigger.active { transform: rotate(180deg); fill: var(--text); }

    .settings-trigger { fill: var(--muted); transition: transform 0.4s; }
    .settings-trigger.active { transform: rotate(90deg); fill: var(--text); }

    #settingsMenu, #notesMenu { display: none; flex-direction: column; gap: 15px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); }
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    button { padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: var(--btn-text); font-weight: 600; cursor: pointer; font-size: 13px; transition: transform 0.2s, filter 0.2s; }
    button.ghost { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    button:hover { filter: brightness(0.9); transform: scale(1.02); }
    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); width: 100%; margin-top: 5px; }
    .btn-danger:hover { background: var(--danger); color: white; }

    /* ======= NOTES ======= */
    .note-input-wrapper { position: relative; display: flex; flex-direction: column; }
    #noteArea { width: 100%; height: 80px; resize: none; margin-bottom: 5px; }
    .pin-btn { position: absolute; right: 10px; bottom: 15px; background: none; border: none; cursor: pointer; fill: var(--muted); padding: 5px; transition: transform 0.2s; }
    .pin-btn:hover { fill: var(--accent); transform: scale(1.3); }

    .pinned-container { position: fixed; top: 20px; width: 200px; display: flex; flex-direction: column; gap: 10px; z-index: 1001; }
    #pinnedLeft { left: 20px; }
    #pinnedRight { right: 20px; }

    .pinned-note {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 10px;
      font-size: 13px;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      height: auto;
      min-height: 40px;
      overflow: hidden;
      word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .pinned-note:hover { transform: scale(1.05); border-color: var(--accent); }

    .note-content {
        outline: none;
        line-height: 1.4;
        white-space: pre-wrap;
        display: -webkit-box;
        -webkit-line-clamp: 10;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: -webkit-line-clamp 0.2s ease;
    }

    .note-content[contenteditable="true"] {
        background: var(--input-bg);
        padding: 5px;
        border-radius: 4px;
        border: 1px solid var(--accent);
        cursor: text;
        -webkit-line-clamp: unset !important;
    }

    .note-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; background: var(--accent); border-radius: 6px; padding: 2px;}
    .pinned-note:hover .note-actions { opacity: 1; }

    .action-btn { background: none; border: none; cursor: pointer; padding: 2px; fill: var(--btn-text); display: flex; align-items: center; transition: transform 0.2s; }
    .action-btn:not(.disabled):hover { fill: var(--btn-text); transform: scale(1.2); opacity: 0.7; }
    .action-btn.del:hover { fill: var(--danger); opacity: 1; }
    .action-btn.save:not(.disabled):hover { fill: var(--success); opacity: 1; }
    .action-btn.disabled { opacity: 0.2; cursor: default; }

    #noteOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 1000; }

    .pinned-note.expanded {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1) !important;
      width: 90%; max-width: 550px; height: auto; max-height: 80vh; z-index: 1002; cursor: default;
      font-size: 16px; overflow-y: auto; padding: 30px; border-color: var(--accent);
    }

    .pinned-note.expanded .note-content {
        -webkit-line-clamp: unset !important;
        display: block;
    }

    .close-expanded-screen {
        position: fixed; top: 20px; right: 20px; cursor: pointer;
        font-size: 32px; color: var(--muted); font-weight: bold;
        transition: color 0.2s, transform 0.2s; width: 45px; height: 45px;
        display: none; align-items: center; justify-content: center;
        z-index: 1100;
    }
    .close-expanded-screen:hover { color: var(--danger); transform: scale(1.2); }

    #hiddenNotice {
      position: fixed;
      top: 20px;
      left: 20px;
      font-style: italic;
      font-size: 13px;
      color: var(--muted);
      z-index: 1005;
      display: none;
      pointer-events: none;
    }

    /* ======= CSS GEMINI ASSISTANT ======= */
    #chat-bubble {
        position: fixed;
        bottom: 25px;
        right: 25px;
        width: 55px;
        height: 55px;
        background: var(--accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        z-index: 1500;
        transition: transform 0.2s ease;
    }
    #chat-bubble:hover { transform: scale(1.05); }

    #chat-window {
        position: fixed;
        bottom: 90px;
        right: 25px;
        width: 350px;
        height: 500px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        display: none;
        flex-direction: row;
        overflow: hidden;
        z-index: 2000;
        transition: width 0.3s, height 0.3s, border-radius 0.3s;
    }

    #chat-window.fullscreen {
        width: 100vw; height: 100vh; bottom: 0; right: 0; border-radius: 0;
    }

    #chat-sidebar {
        display: none; width: 250px; background: var(--item-bg); border-right: 1px solid var(--card-border);
        padding: 15px; flex-direction: column; gap: 10px;
    }
    #chat-window.fullscreen #chat-sidebar { display: flex; }

    #chat-history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 5px; }
    #chat-history-list::-webkit-scrollbar { width: 4px; }
    #chat-history-list::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 4px; }

    .chat-hist-item {
        padding: 10px; background: var(--card); border: 1px solid var(--card-border);
        border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; transition: border-color 0.2s;
    }
    .chat-hist-item:hover { border-color: var(--accent); }
    .chat-hist-item.active { border-color: var(--accent); background: var(--input-bg); }
    .chat-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
    .del-chat-btn { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: bold; transition: color 0.2s, transform 0.2s; }
    .del-chat-btn:hover { color: var(--danger); transform: scale(1.2); }

    #chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    #chat-header {
        background: var(--item-bg);
        padding: 15px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-bottom: 1px solid var(--card-border);
        position: relative;
        width: 100%;
    }

    #ai-title { font-weight: bold; }

    .header-icons { position: absolute; right: 15px; display: flex; gap: 15px; align-items: center; }
    .header-icons span { cursor: pointer; transition: transform 0.2s, color 0.2s; color: var(--muted); display: flex; align-items: center; justify-content: center;}
    .header-icons span:hover { color: var(--text); transform: scale(1.1); }

    #chat-messages {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .msg-chat { position: relative; max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; word-wrap: break-word;}
    .user-msg { align-self: flex-end; background: var(--accent); color: var(--btn-text); }
    .ai-msg { align-self: flex-start; background: var(--item-bg); color: var(--text); border: 1px solid var(--card-border); }

    .save-note-btn {
        position: absolute;
        top: -12px;
        right: -12px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 50%;
        width: 34px;
        height: 34px;
        cursor: pointer;
        opacity: 0;
        transform: scale(0.8);
        transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        z-index: 10;
        padding: 7px;
    }
    .msg-chat.ai-msg:hover .save-note-btn {
        opacity: 1;
        transform: scale(1);
    }
    .save-note-btn:hover {
        background: var(--item-bg);
        border-color: var(--accent);
        transform: scale(1.1) !important;
    }
    .save-note-btn img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: invert(var(--icon-invert));
    }

    /* ======= MARKDOWN ======= */
    .markdown-body p { margin: 0 0 8px 0; }
    .markdown-body p:last-child { margin: 0; }
    .markdown-body ul, .markdown-body ol { margin: 0; padding-left: 20px; }
    .markdown-body pre { background: var(--input-bg); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 5px 0; border: 1px solid var(--card-border); }
    .markdown-body code { font-family: monospace; background: var(--input-bg); padding: 2px 4px; border-radius: 4px; font-size: 12px;}

    #chat-input-container { padding: 12px; border-top: 1px solid var(--card-border); display: flex; gap: 8px; background: var(--card); }
    #chat-input-container input { flex: 1; padding: 10px; font-size: 13px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--input-bg); color: inherit; outline: none; }
    .typing { font-style: italic; color: var(--muted); font-size: 12px; }

    #msg-bubble {
        position: fixed;
        bottom: 25px;
        left: 25px;
        width: 55px;
        height: 55px;
        background: var(--accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        z-index: 2000;
        transition: transform 0.2s ease;
    }
    #msg-bubble:hover { transform: scale(1.05); }
    #msg-bubble svg { fill: var(--btn-text); }

    #msg-window {
        position: fixed;
        bottom: 90px;
        left: 25px;
        width: 350px;
        height: 500px;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 2000;
        transition: width 0.3s, height 0.3s, border-radius 0.3s;
    }
    #msg-window.fullscreen {
        width: 100vw; height: 100vh; bottom: 0; left: 0; border-radius: 0;
    }

    /* ======= MODAL GÉNÉRIQUE ======= */
    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center;
        z-index: 9000;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
        background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
        padding: 24px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        animation: modalIn 0.2s ease;
    }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .modal-box h3 { margin: 0; font-size: 16px; }
    .modal-box p { margin: 0; font-size: 13px; color: var(--muted); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ======= BADGE CONNEXION ======= */
    #msg-status-dot {
        position: absolute; bottom: -3px; right: -3px;
        width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--bg);
        background: var(--danger);
    }
    #msg-status-dot.online { background: var(--success); }

    /* ======= PARTAGE DE NOTE ======= */
    .share-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .share-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: var(--item-bg); cursor: pointer; font-size: 13px; transition: background 0.2s; }
    .share-item:hover { background: var(--card-border); }
    .share-item input[type="checkbox"] { accent-color: var(--accent); }

    /* ======= MESSAGERIE ======= */
    #msg-unread-badge {
      position: absolute; top: -6px; right: -6px; min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--text); color: var(--bg); border-radius: 99px;
      font-size: 10px; font-weight: 700; line-height: 16px; text-align: center;
      display: none; pointer-events: none;
    }
    #msg-topbar { display:flex; align-items:center; justify-content:flex-end; gap:12px; padding:6px 12px; background:var(--item-bg); border-bottom:1px solid var(--card-border); flex-shrink:0; }
    #msg-topbar span { cursor:pointer; color:var(--muted); display:flex; align-items:center; transition: color .2s, transform .2s; }
    #msg-topbar span:hover { color:var(--text); transform:scale(1.1); }
    #msg-frame { flex:1; width:100%; border:0; min-height:0; background:var(--bg); }
  
    /* ======= APPS (galerie d'apps HTML) ======= */
    .apps-box { padding: 12px 20px; }
    .apps-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; }
    .apps-header h2 { margin: 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .apps-header-right { display: flex; align-items: center; gap: 10px; }
    .apps-count { display: none; align-items: center; gap: 6px; font-size: 11px; color: var(--text); background: var(--item-bg); border: 1px solid var(--card-border); border-radius: 99px; padding: 1px 9px; }
    .apps-count::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    #appsMenu { display: none; flex-direction: column; gap: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--card-border); }
    .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
    .apps-empty { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
    .app-tile {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 7px;
      padding: 14px 6px 18px; border-radius: 10px; background: transparent;
      border: none; cursor: pointer; user-select: none;
      transition: transform 0.2s;
    }
    .app-tile:hover { transform: translateY(-1px); }
    .app-tile:hover .app-icon { border-color: var(--accent); }
    .app-tile.add { color: var(--muted); }
    .app-icon {
      width: 46px; height: 46px; border-radius: 11px; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--input-bg); border: 1px solid var(--card-border);
      font-weight: 700; font-size: 20px; color: var(--text);
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .app-icon.plus { font-weight: 400; font-size: 26px; color: var(--muted); border-style: dashed; background: transparent; }
    .app-icon.sm { width: 40px; height: 40px; font-size: 18px; }
    .app-icon.xs { width: 20px; height: 20px; border-radius: 5px; font-size: 11px; }
    .app-name { font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-dot { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: none; }
    .app-tile.running .app-dot { display: block; }
    .app-tile.bg .app-dot { animation: appPulse 1.6s ease-in-out infinite; }
    @keyframes appPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .app-tile-menu {
      position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; padding: 0; line-height: 1;
      background: transparent; color: var(--muted); border: none; border-radius: 6px; font-size: 16px;
      opacity: 0; transition: opacity 0.15s, background 0.15s;
    }
    .app-tile-menu:hover { background: var(--card-border); color: var(--text); filter: none; transform: none; }
    .app-tile:hover .app-tile-menu { opacity: 1; }
    @media (hover: none) { .app-tile-menu { opacity: 0.8; } }

    /* Fenêtre d'une app */
    .app-win { position: fixed; display: flex; flex-direction: column; background: var(--card); color: var(--text); border: 1px solid var(--card-border); z-index: 3000; }
    .app-win.is-full { left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; border: none; border-radius: 0; }
    .app-win.is-window { border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.55); overflow: hidden; min-width: 320px; min-height: 220px; }
    .app-win.is-min { visibility: hidden; pointer-events: none; }
    .app-win-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-shrink: 0;
      height: 38px; padding: 0 6px 0 12px; background: var(--item-bg); border-bottom: 1px solid var(--card-border);
      user-select: none; touch-action: none;
    }
    .app-win.is-window .app-win-bar { cursor: grab; }
    .app-win-title { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; font-weight: 600; }
    .app-win-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .app-win-btns { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
    .app-wb {
      width: 34px; height: 28px; padding: 0; display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--muted); border: none; border-radius: 6px;
    }
    .app-wb:hover { background: var(--card-border); color: var(--text); filter: none; transform: none; }
    .app-wb.close:hover { background: var(--danger); color: #fff; }
    .app-win-body { position: relative; flex: 1; min-height: 0; background: var(--card); }
    .app-frame { width: 100%; height: 100%; border: 0; display: block; background: transparent; }
    .app-win.is-window:not(.top) .app-win-body::after { content: ''; position: absolute; inset: 0; z-index: 5; }
    body.app-interacting .app-frame { pointer-events: none; }
    body.app-interacting { user-select: none; }
    .app-rs { display: none; position: absolute; z-index: 6; touch-action: none; }
    .app-win.is-window .app-rs { display: block; }
    .app-rs.n { top: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
    .app-rs.s { bottom: 0; left: 14px; right: 14px; height: 6px; cursor: ns-resize; }
    .app-rs.e { right: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
    .app-rs.w { left: 0; top: 14px; bottom: 14px; width: 6px; cursor: ew-resize; }
    .app-rs.ne { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
    .app-rs.nw { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
    .app-rs.se { bottom: 0; right: 0; width: 14px; height: 14px; cursor: nwse-resize; }
    .app-rs.sw { bottom: 0; left: 0; width: 14px; height: 14px; cursor: nesw-resize; }

    /* Modale ajout / modification */
    #modal-app input[type="text"] { flex: none; width: 100%; }
    #modal-app .app-icon-row input[type="text"] { flex: 1; }
    .app-file-row, .app-icon-row { display: flex; align-items: center; gap: 10px; }
    .app-file-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .app-allow { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
    .app-allow input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .app-error { display: none; color: var(--danger); font-size: 12px; }
    .app-error.show { display: block; }
  
    /* ======= COMPTE (Réglages) ======= */
    #accountBox { border-top: 1px solid var(--card-border); padding-top: 12px; }
    #accountBox input { width: 100%; box-sizing: border-box; flex: none; margin-bottom: 8px; padding: 10px; font-size: 13px; font-family: inherit; background: var(--input-bg); color: var(--text); border: 1px solid var(--card-border); border-radius: 8px; }
    #accountBox input:focus { outline: none; border-color: var(--accent); }
    #accLoggedOut > button, #accLoggedIn > button { width: 100%; margin-top: 4px; }
    .acc-switch { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
    .acc-link { display: inline; width: auto; padding: 0; background: none; border: none; color: var(--accent); text-decoration: underline; font-size: 12px; font-weight: 400; }
    .acc-link:hover { background: none; filter: none; transform: none; }
    #accWho { font-size: 13px; margin-bottom: 10px; overflow-wrap: anywhere; }
  
    /* ======= IA : bouton "réessayer" et note de modèle ======= */
    .ai-retry-btn { display: block; width: auto; margin-top: 10px; padding: 6px 12px; font-size: 12px; font-weight: 500; background: var(--item-bg); color: var(--text); border: 1px solid var(--card-border); border-radius: 8px; cursor: pointer; }
    .ai-retry-btn:hover { border-color: var(--accent); filter: none; transform: none; }
    .ai-model-note { margin-top: 8px; font-size: 11px; color: var(--muted); }

    .current-page-viewer { position: fixed; inset: 0; z-index: 10000; display: flex; flex-direction: column; background: #000; }
    .current-page-viewer[hidden] { display: none; }
    .current-page-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-shrink: 0; height: 42px; padding: 0 12px; background: var(--card); color: var(--text); }
    .current-page-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .current-page-content { flex: 1; min-height: 0; }
    .current-page-content iframe, .current-page-content object { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  </style>
